report:
  id: fath_arxiv2024
  slug: '2410.21492'
  title: 'FATH: Authentication-based Test-time Defense against Indirect Prompt Injection Attacks'
  first_author: Jiongxiao Wang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2410.21492'
  version_read: arXiv v2
  first_date: '2024-10-28'
  read: F
  role: proposes
  code_release: https://github.com/Jayfeather1024/FATH
  extraction_scope: 'Sections 4 and 5.1 to 5.6: the No Defense and FATH rows of Table 2 (Judge Score, Combined Attack and Adaptive Attack columns), Table 3, the optimisation-attack numbers in Section 5.5 and the w/o Authentication
    Tags row of Table 4; the abstract claim (other baselines, Naive to Fake Completion columns and the appendix not coded)'
defences:
- id: fath_l3
  name: FATH
  origin: this_report
  base_checkpoint: Meta-Llama-3-8B-Instruct
  axis1:
  - delimiters_markers
  axis2:
  - prompting
  - fixed_inference_rule
  isolation: ablation_present
  signal_dependence: measured_other_checkpoint
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 5
  components:
  - instruction and external text wrapped in fresh hash-based tags
  - 'security policy: answer every instruction, each under its own tag'
  - rule-based parsing returns only the text under the authorised-response tag
  - chain-of-thought and in-context examples in the prompt
  layout: 'one user message: instruction and external text each between hash-based tags'
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: Finally, an authentication verification process
  signal_dependence_detail: 'Table 4 (GPT3.5) removes the authentication tags: adaptive ASR 0.06 to 0.18 against 0.00'
  pages:
    signal_dependence: 9
    isolation: 9

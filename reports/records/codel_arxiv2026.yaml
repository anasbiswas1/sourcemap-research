  axis2:
  - sft
  - adversarial_rl
  isolation: ablation_present
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 1
  components:
  - defender updated each round with LoRA-based GDPO under a decoupled reward for safety, task progress and format
  - a co-evolving prober searches injection rounds, methods and payloads, rewarded for attack success and for late detection
  - SFT stage before GDPO
  layout: agent loop with a shared tool schema and system prompt; tool outputs carry the injection

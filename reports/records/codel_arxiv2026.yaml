report:
  id: codel_arxiv2026
  slug: '2609.34463'
  title: 'CoDeL: Co-Evolutionary Defense against Indirect Prompt Injection in LLM-based Agents'
  first_author: Xiao Yang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2609.34463'
  version_read: arXiv v1
  first_date: '2026-09-28'
  read: F
  role: proposes
  code_release: stated as available in a footnote; not checked
  extraction_scope: 'Section 5.2: Table 1 rows No defense, AgentAlign, DRIP, RETA, SecOPD, Meta-SecAlign and CoDeL on both models and all three benchmarks; the abstract claim (MELON and PromptArmor, which filter or rewrite
    outside the model, PIGuard and TSGuard, which are detectors, Figure 3, the generalisation study of Section 5.4 and the ablations not coded)'

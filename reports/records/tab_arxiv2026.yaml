coverage:
  R1: direct
  R2clean: not_reported
  R2attack: direct
  R3ns: not_reported
  R3cp: proxy
  R3safe: not_reported
  where:
    R1: Table 10 distractor execution (irrelevant, not malicious, injected instructions)
    R2attack: Table 10 task resolution
    R2clean: not reported
    R3cp: Table 10 task resolution (the helpful cue in the file must be used)
schema_gaps:
- where: report
  note: distractors are plausible irrelevant instructions rather than attacks, so distractor execution is coded as a proxy for injection success; the GPT-5.4 mini defence rows are single runs

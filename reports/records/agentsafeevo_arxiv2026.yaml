report:
  id: agentsafeevo_arxiv2026
  slug: '2610.19422'
  title: 'AgentSafeEvo: Adversarial Co-Evolution for LLM Agent Safety'
  first_author: Chenxu Wang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2610.19422'
  version_read: arXiv v1
  first_date: '2026-10-14'
  read: F
  role: proposes
  code_release: https://github.com/lalalamdbf/AgentSafeEvo and Hugging Face collection (linked on p. 1)
  extraction_scope: 'Section 4: Table 1 AgentDojo and MSB columns for Qwen3-8B, Spotlighting, Static-AT and AgentSafeEvo; Table 2; Table 3 MSB, ALFWorld and ToolHop columns; the abstract claim (Agent-SafetyBench and AgentHarm
    columns, which pool direct, harmful-request and indirect risks, Prompt Guard 2, a detector, and Figure 3, whose generated tasks mix six attack categories including direct injection and jailbreaks, not coded)'
defences:
- id: ase
  name: AgentSafeEvo (attacker-defender co-evolution with learnability weighting)
  origin: this_report
  base_checkpoint: Qwen3-8B
  axis1:
  - no_signal
  axis2:
  - adversarial_rl
  isolation: ablation_present
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 1
  components:
  - 'attacker (Qwen3-8B, SFT-initialised on about 10,000 adversarial and 10,000 benign tasks) writes adversarial agent tasks: user query, tool definitions and environment'
  - defender trained with GRPO on safety and utility rewards from a Qwen3.8-27B reward model; attacker rewarded when the defender's reward falls
  - 'learnability-guided task weighting: tasks with more within-task spread in defender reward get larger weight in both updates'
  layout: multi-turn tool-calling agent; attacks reach it through user queries, tool descriptions or environment observations
  layout_compat: &id001
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: a co-evolutionary reinforcement learning framework for agent safety
  pages:
    components: 7
    isolation: 10
- id: static
  name: Static-AT (fixed SFT attacker in the loop, defender trained with GRPO, no weighting)
  origin: this_report
  base_checkpoint: Qwen3-8B
  axis1:
  - no_signal
  axis2:
  - preference_optimisation
  isolation: not_applicable
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 7
  layout: multi-turn tool-calling agent; attacks reach it through user queries, tool descriptions or environment observations
  layout_compat: *id001
  anchor: Static Adversarial Training (Static-AT), which keeps the SFT attacker fixed
- id: spot
  name: Spotlighting, delimiting variant (tool outputs wrapped in « », system prompt marks them untrusted)
  origin: other_report
  base_checkpoint: Qwen3-8B
  axis1:
  - delimiters_markers
  axis2:
  - prompting
  isolation: not_applicable
  signal_dependence: not_reported
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 7
  layout: multi-turn tool-calling agent; attacks reach it through user queries, tool descriptions or environment observations; tool outputs wrapped in delimiters
  layout_compat: *id001
  anchor: the prompt-based defense Spotlighting with Delimiting
- id: nolw
  name: co-evolution without learnability weighting
  origin: this_report

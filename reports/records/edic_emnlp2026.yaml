- id: k1
  text: EDIC improves both safety and utility over the strongest prior defence, with up to 7.7 points more harmful rejection and 12.5 points more Arena-Hard-Auto on Qwen3-4B
  location: abstract
  anchor: EDIC improves both safety and utility over the strongest prior defense
  jobs:
  - R1
  - general_utility
  supported_by:
  - c_q3_edic_reasalign_arena

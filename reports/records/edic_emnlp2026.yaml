report:
  id: edic_emnlp2026
  slug: '2610.22874'
  title: 'Identify, Classify, Act: Per-Instruction Controlled Compliance for LLMs over External Data'
  first_author: Zesheng Shi
  venue: EMNLP 2026 (main conference)
  peer_reviewed: 'yes'
  doi: 10.18653/2026.emnlp-main.1092
  arxiv: '2610.22874'
  version_read: arXiv v1
  first_date: '2026-10-16'
  read: F
  role: proposes
  code_release: https://github.com/yingyingxia666/EDIC (linked in the abstract)
  extraction_scope: 'Sections 5 and 6: Table 1 (all rows and columns), Table 2 (trigger), Table 3 (data composition; H-R, B-F, DJ-U and DJ-ASR) and Table 6 (NotInject); the abstract claim (Table 4, Tables 5, 7 and 8 and Figures
    3 to 6 not coded)'
defences:
- id: edic_q3
  name: EDIC (judge-guided per-instruction compliance training, classification trigger on)
  origin: this_report
  base_checkpoint: Qwen3-4B
  axis1:
  - no_signal
  axis2:
  - sft
  - preference_optimisation
  - distillation
  isolation: ablation_present
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 4
  components: &id001
  - policy SFT on chain-of-thought responses written by GPT-5.4 that identify each embedded instruction, label it beneficial or harmful, and act on the labels
  - generative judge (SFT then GRPO) decides per instruction whether the output followed it
  - 'policy GRPO on a decomposed reward: credit per beneficial instruction followed, penalty per harmful instruction followed, plus a structure bonus'
  - training documents mix beneficial and harmful instructions in four scene families (email, API docs, medical guidance, knowledge evidence)
  layout: user query with external data in the prompt; tool returns for AgentDojo and InjecAgent
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: The RL reward decomposes across instructions
  pages:
    components: 4
    isolation: 6

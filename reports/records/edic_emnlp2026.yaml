coverage:
  R1: direct
  R2clean: not_reported
  R2attack: direct
  R3ns: not_reported
  R3cp: not_reported
  R3safe: not_reported
  where:
    R1: Table 1 (AgentDojo, CyberSecEval 2 and InjecAgent ASR; harmful-reject rate on the authors' data as a proxy)
    R2attack: Table 1 (AgentDojo utility under attack)
    general_utility: Table 1 (Arena-Hard-Auto, MT-Bench)
    R2clean: AgentDojo clean utility not reported
schema_gaps:
- where: defences secalign_*, struq_*, reasalign_*, metasec_l31
  note: the paper does not say whether these baselines were re-trained on Qwen3-4B and Llama-3.1-8B or which checkpoints were used; Appendix A also lists PromptGuard and Instruction Hierarchy, which do not appear in any table
- where: evaluations ev_*_hr, ev_*_bf
  note: harmful-reject and benign-follow rates are on the authors' own held-out documents and the scorer is not named; harmful-reject is coded as an R1 proxy
- where: evaluations ev_*_inj
  note: InjecAgent was run in base and enhanced settings but Table 1 gives one number without saying how they were combined
- where: claims k1
  note: on Llama-3.1-8B, EDIC's harmful-reject rate (92.8) is below ReasAlign's (93.1) and its AgentDojo ASR (0.1) equals ReasAlign's and is above Meta-SecAlign's (0.0)

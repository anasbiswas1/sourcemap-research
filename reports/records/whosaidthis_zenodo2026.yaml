report:
  id: whosaidthis_zenodo2026
  slug: doi_10_5281_zenodo_23758886
  title: Who said this? Most chat models weigh a text's source differently for each behaviour, and a steering lever against injected instructions
  first_author: Sam Ramdan
  venue: Zenodo preprint
  peer_reviewed: 'no'
  doi: 10.5281/zenodo.23758886
  version_read: Zenodo v2 (30 October 2026)
  first_date: '2026-10-29'
  read: F
  role: proposes
  code_release: https://github.com/Somebodyhere101/whose-words-count
  extraction_scope: 'Sections 3.7 and 3.8: the steering lever against no defence on SEP and InjecAgent for twelve models (the two result tables); the abstract claim (the source-ranking and patching analyses test no defence;
    the prompt-defence and random-direction comparisons are described in the text without per-model numbers and are not coded)'

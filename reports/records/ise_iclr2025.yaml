report:
  id: ise_iclr2025
  slug: '2410.09102'
  title: 'Instructional Segment Embedding: Improving LLM Safety with Instruction Hierarchy'
  first_author: Tong Wu
  venue: ICLR 2025
  peer_reviewed: 'yes'
  arxiv: '2410.09102'
  version_read: arXiv v2 (marked as published at ICLR 2025)
  first_date: '2024-10-09'
  read: F
  role: proposes
  code_release: PyTorch snippet in Appendix A; repository not checked
  extraction_scope: 'Sections 5 and 6.1: Table 1 (Structured Query benchmark, Llama-2-13B), the AlpacaEval row and the Naive and Completion-R rows for in-domain and out-of-domain attacks; the abstract claims (Ignore and Escape-S
    rows, Average and Worst rows, the Instruction Hierarchy benchmark in Figure 5, Sections 6.3 to 6.4 and the appendix tables not coded)'

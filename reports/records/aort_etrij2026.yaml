report:
  id: aort_etrij2026
  slug: doi_10_4218_etrij_2025_0449
  title: Adaptive orthogonal role-aware transformer for robust instruction alignment
  first_author: Yeo Chan Yoon
  venue: ETRI Journal 48(5) (2026) 924-935
  peer_reviewed: 'yes'
  doi: 10.4218/etrij.2025-0449
  version_read: published version (Wiley)
  first_date: '2026-06-24'
  read: F
  role: proposes
  code_release: not stated
  extraction_scope: 'Section 7.1: the Vanilla and AORT averages over five backbones stated in the text for the four indirect benchmarks, and the LLaMA 3.1 8B BIPIA-text values stated in the abstract; the abstract claim (the
    per-model cells of Table 1, including the ISE and ASIDE rows, are not coded because the PDF text layer prints every decimal point in that table as a colon; the direct-injection columns are out of scope; Tables 2 to 4 are
    mechanism analyses)'
defences:
- id: aort_avg
  name: AORT (adaptive orthogonal role-aware transformer)
  origin: this_report
  base_checkpoint: five backbones averaged (LLaMA 2 7B, LLaMA 2 13B, LLaMA 3.1 8B, Qwen2.5 7B, Mistral 7B)
  axis1:
  - chat_roles
  - internal_intervention
  axis2:
  - sft
  isolation: no_ablation
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 6
  components: &id001
  - 'role mask from the chat template: system and developer text is instruction; user turns, retrieved documents and tool outputs are data'
  - at every layer, data tokens are re-encoded with a learned orthonormal transform and instruction keys get a learned additive attention bias
  - backbone frozen; AORT parameters trained with next-token loss plus cross-role margin, decorrelation and smoothness terms on the same instruction data as the baselines
  layout: chat template with system/developer instruction segments and user or retrieved data segments
  layout_compat: &id002
    user_turn: untested
    separate_role: supported
    system_context: supported
    agent_tool_result: untested
  anchor: This structure was used to supply a binary role mask
  pages:
    components: 6
- id: aort_l31
  name: AORT (adaptive orthogonal role-aware transformer)
  origin: this_report
  base_checkpoint: LLaMA 3.1 8B

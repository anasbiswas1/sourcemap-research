report:
  id: actconsistency_arxiv2026
  slug: '2605.28467'
  title: Mitigating Adaptive Attacks against Reasoning Models with Activation Consistency Training
  first_author: Avidan Shah
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2605.28467'
  version_read: arXiv v1
  first_date: '2026-05-27'
  read: F
  role: proposes
  code_release: not checked
  extraction_scope: 'Section 4 and Appendices A.4 and A.5: Table 1 (static prompt injection and utility, five models), Table 3 test split (adaptive GRPO attacker) and the Baseline and SecAlign rows of Table 4; the abstract
    claim (PromptArmor, a detector, is left out; the jailbreak results of Section 5 and Tables 5 to 8, the steering analysis and the train-split columns not coded)'
defences:
- id: act_q17
  name: ACT (activation consistency training)
  origin: this_report
  base_checkpoint: Qwen3-1.7B
  axis1:
  - no_signal
  axis2:
  - distillation
  isolation: not_applicable
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 3
  components:
  - pairs of a clean prompt and the same prompt with an injection wrapped into the data
  - LoRA training so that hidden states on the wrapped prompt match the frozen base model's hidden states on the clean prompt at shared suffix positions, every layer
  anchor: ACT minimizes
- id: bct_q17
  name: BCT (output-level consistency training)
  origin: this_report
  base_checkpoint: Qwen3-1.7B
  axis1:
  - no_signal
  axis2:
  - sft
  - distillation
  isolation: not_applicable
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 3
  components:
  - cross-entropy fine-tuning on the wrapped prompt with the base model's own completion (with its reasoning) of the clean prompt as target
  anchor: BCT requires no additional formalism beyond standard cross entropy

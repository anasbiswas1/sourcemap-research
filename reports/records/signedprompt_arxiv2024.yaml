report:
  id: signedprompt_arxiv2024
  slug: '2401.07612'
  title: 'Signed-Prompt: A New Approach to Prevent Prompt Injection Attacks Against LLM-Integrated Applications'
  first_author: Xuchen Suo
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2401.07612'
  version_read: arXiv v1
  first_date: '2024-01-15'
  read: F
  role: proposes
  code_release: none found in the paper
  later_version: DOI 10.1063/5.0222987 (from the search record; not read)
  extraction_scope: 'whole report (7 pages): Tables 1 to 3 read; Table 3 coded (encoder accuracy in Table 1 is not a defence outcome); the abstract claim'
defences:
- id: sp_pe_gpt4
  name: Signed-Prompt (prompt-engineered adjusted LLM, LLM-PE)
  origin: this_report
  base_checkpoint: ChatGPT-4
  axis1:
  - delimiters_markers
  axis2:
  - prompting
  isolation: no_ablation
  signal_dependence: not_reported
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 5
  anchor: this paper employs prompt engineering to construct a Large Language Model (LLM-PE)
  released_weights: not applicable
  components: &id001
  - an encoder (ChatGPT-4 prompted) replaces the authorised user's sensitive instruction word with a rare signature string (delete -> toeowx)
  - the adjusted model emits the real command only for the signed form and an invalid command for the raw word
  layout: 'one prompt: signed user instruction and unsigned external content'
  layout_compat: &id002
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
- id: sp_ft_chatglm6b
  name: Signed-Prompt (fine-tuned adjusted LLM, LLM-FT)
  origin: this_report
  base_checkpoint: ChatGLM-6B
  axis1:
  - delimiters_markers
  axis2:
  - sft
  isolation: no_ablation
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 5
  anchor: this paper develops another LLM (LLM-FT) based on the ChatGLM-6B model
  released_weights: not stated
  components: *id001
  layout: 'one prompt: signed user instruction and unsigned external content'
  layout_compat: *id002

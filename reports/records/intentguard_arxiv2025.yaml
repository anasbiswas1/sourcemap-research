report:
  id: intentguard_arxiv2025
  slug: '2512.00966'
  title: Mitigating Indirect Prompt Injection via Instruction-Following Intent Analysis
  first_author: Mintong Kang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2512.00966'
  version_read: arXiv v1
  first_date: '2025-11-30'
  read: F
  role: proposes
  extraction_scope: 'Tables 1 and 2: Vanilla, SEP Defense and IntentGuard (recovery mode) for Qwen3-32B and gpt-oss-20B on AgentDojo and Mind2Web, benign utility, and utility and attack success under the four attacks; the
    abstract claim (PromptArmor, an external LLM detector, is left out; the ablations of Figure 3 are shown only as bars; Tables 3 and 4 concern origin tracing settings)'

report:
  id: pft_arxiv2025
  slug: '2505.00626'
  title: 'The Illusion of Role Separation: Hidden Shortcuts in LLM Role Learning (and How to Fix Them)'
  first_author: Zihao Wang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2505.00626'
  version_read: arXiv v2
  first_date: '2025-05-01'
  read: F
  role: proposes
  code_release: none found in the paper
  extraction_scope: 'Sections 3 to 6.2 and Appendix B: Table 1 (base and dataset-initial columns) and Table 2 (dataset-initial, both models); the abstract claim (the dataset-symm column of Table 1, Figures 2 to 8 and Figure
    6''s utility panel, whose training set is not stated, not coded)'
defences:
- id: pft_llama
  name: Position-enhanced fine-tuning (PFT, d = 512)
  origin: this_report
  base_checkpoint: Llama-3-8B-Instruct
  axis1:
  - chat_roles
  - position
  axis2:
  - sft
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 7
  components:
  - position IDs of user tokens shifted by a gap d = 512 after the last system token, order kept within each role
  - LoRA on query and key projections, about 2,300 samples (dataset-initial), user input treated as data for the system task
  layout: key instruction in the system message, the attacker's text in the user message
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: untested
  anchor: We call this method Position-enhanced fine-tuning (PFT)
  pages:
    components: 3
    isolation: 8

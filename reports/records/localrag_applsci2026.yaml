  - delimiters_markers
  axis2:
  - prompting
  isolation: not_applicable
  signal_dependence: not_reported
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 9
  layout: 'local RAG assistant: top-3 retrieved documents in the prompt, simulated tools requested as TOOL_CALL lines'
  layout_compat: &id001
    user_turn: supported
    separate_role: untested
    system_context: supported
    agent_tool_result: untested
  anchor: 'C3: Explicit instruction–data separation'
- id: c4

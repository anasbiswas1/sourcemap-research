report:
  id: localrag_applsci2026
  slug: doi_10_3390_app162111039
  title: 'Securing Locally Deployed LLM-RAG Assistants: A Cross-Model and Cross-Lingual Evaluation of Indirect Prompt Injection Defenses'
  first_author: Sofia Gonzalez-Sancho
  venue: Applied Sciences 16 (2026) 11039
  peer_reviewed: 'yes'
  doi: 10.3390/app162111039
  version_read: published version
  first_date: '2026-11-07'
  read: F
  role: re_measures
  code_release: repository with Docker reproduction (Section 4.2)
  extraction_scope: 'Sections 5.1 and 5.4: configurations C2 (tools, no defence), C3 and C4 in Table 6 (Llama 3.1 8B) and Table 10 (four language conditions), and the English replication values in the text (C1 without tools,
    and C5, a deterministic output filter, not coded; the cross-model C3 and C4 values are in Figure 2 only, and the abstract''s headline claims concern C5)'

report:
  id: reasalign_arxiv2026
  slug: '2601.10173'
  title: 'ReasAlign: Reasoning Enhanced Safety Alignment against Prompt Injection Attack'
  first_author: Hao Li
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2601.10173'
  version_read: arXiv v1
  first_date: '2026-01-15'
  read: F
  role: proposes
  code_release: https://github.com/leolee99/ReasAlign (linked from the abstract; not checked)
  extraction_scope: 'whole report (16 pages): Figure 3 (average column), Figure 4 (all bars), Table 1 (reasoning ablation) and Table 2 (AgentDojo and InjecAgent, both base models); the abstract claims (the four single benchmarks
    of Figure 3, Figure 5 node scaling and Figure 10 token cost not coded)'
defences:
- id: reasalign_l
  name: ReasAlign
  origin: this_report
  base_checkpoint: Llama-3.1-8B-Instruct
  axis1:
  - delimiters_markers
  axis2:
  - sft
  - distillation
  - preference_optimisation
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 4
  components: &id001
  - LoRA instruction tuning on SQuADv2 samples with injected instructions, whose structured reasoning (problem analysis, reasoning, final answer) was written by GPT-4o-mini from manual guidelines
  - logic judge trained with DPO on reasoning that follows the user (chosen) against reasoning that follows the injection (rejected)
  - 'test-time beam search: N candidate steps sampled, judge picks the best, N = 3 by default'
  layout: user query and external data shown under the labels User Query and External Data in the paper's examples
  layout_compat: &id002
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: we adopt Low-Rank Adaptation (LoRA) instruction tuning
  pages: &id003
    components: 4
    layout: 14
    layout_compat: 7

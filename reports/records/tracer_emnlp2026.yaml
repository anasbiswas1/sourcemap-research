  supported_by:
  - c_fu3_frame
  page: 1
- id: k2
  text: TRACER reduces RAG-framed ASR from 65.5% to 6.1% on GSM8K with Qwen2.5-3B-Instruct while keeping 78 to 82% clean accuracy
  location: abstract
  anchor: TRACER reduces RAG-framed ASR from 65.5% to 6.1%
  jobs:
  - R1
  - R2
  supported_by:
  - c_rag3_rag
  - c_rag3_para
  page: 1
- id: k3
  text: joint RAG and tool training reaches 13.9% average ASR across framings at 3B; one epoch at 7B reaches 9.4%
  location: abstract
  anchor: Joint RAG+tool training achieves 13.9% average ASR across framings
  jobs:
  - R1
  supported_by:
  - c_multi3_fu
  - c_multi3_rag

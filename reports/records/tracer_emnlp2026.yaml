report:
  id: tracer_emnlp2026
  slug: '2610.19133'
  title: 'TRACER: Trace-Regularized Training Against Indirect Prompt Injection'
  first_author: Kshitij Mishra
  venue: Findings of EMNLP 2026
  peer_reviewed: 'yes'
  doi: 10.18653/2026.findings-emnlp.2124
  arxiv: '2610.19133'
  version_read: arXiv v1
  first_date: '2026-10-13'
  read: F
  role: proposes
  code_release: https://github.com/Mishrakshitij/TRACER.git (linked in the abstract)
  extraction_scope: 'Sections 5 and appendices A, D to F: Table 8 rows for the 3B base, RAG, final tool, multi-framing and agent models and the 7B base, epoch-1 and final RAG models; Table 1 (a) and (b); Table 5 (follow-up-trained
    snapshots); Table 6; Table 9 clean accuracy (base and final); Table 11; the abstract claims (Table 7 diagnostics, Tables 9, 10 and 12 intermediate checkpoints and Figures 3 to 12 not coded)'
defences:
- id: rag3
  name: TRACER, RAG specialist (3B, final checkpoint)
  origin: this_report
  base_checkpoint: Qwen2.5-3B-Instruct
  axis1:
  - delimiters_markers
  axis2:
  - preference_optimisation
  - distillation
  isolation: ablation_present
  signal_dependence: measured_other_checkpoint
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 5
  signal_dependence_detail: 'Table 11: RAG wrapper and RAG system prompt removed one at a time and together; the full condition reads 5.5% against the 6.1% of the main checkpoint and the text does not say whether the variants
    were retrained'
  components: &id001
  - 'channel-sampled three-turn game: clean answer, the same payload rendered as a follow-up, RAG document, tool output or agent message, then the post-attack answer'
  - GRPO on a composite post-attack reward (answer, process, anchor retention, evidence-gated corrigibility, length)
  - 'ATRC: KL and token loss pulling the attacked reasoning towards committed spans of the clean trace when the injected evidence is invalid'
  - 4-bit QLoRA, 2,000 GSM8K training tasks, 15% benign episodes
  layout: RAG document wrapper with a RAG-specific system prompt
  layout_compat: &id002
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: The optimizer itself is standard GRPO
  pages:
    components: 4
    isolation: 8

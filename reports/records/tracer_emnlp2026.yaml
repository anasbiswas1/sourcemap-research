coverage:
  R1: proxy
  R2clean: direct
  R2attack: proxy
  R3ns: not_reported
  R3cp: not_reported
  R3safe: not_reported
  where:
    R1: conditional answer flip (correct clean answer turned wrong), Tables 1, 5, 6, 8 and 11
    R2clean: Table 9 (tool training only; RAG clean accuracy is a 78 to 82% range in the text and Figure 4)
    R2attack: Table 6 evidence accuracy
schema_gaps:
- where: results r_* (R1)
  note: ASR is a conditional answer flip on GSM8K pooled over three payload families (reasoning rewrite, false verified answer, explicit instruction); it does not check that an injected instruction was carried out, so R1 is
    coded as a proxy
- where: evaluations ev_base3_rag, ev_rag3_rag
  note: the base RAG ASR is 65.5 in Tables 1, 3, 7 and 8 but 65.6 (99/151) in Table 5, whose caption notes reporting-granularity differences; the TRACER RAG denominator is 164 in Table 5 and 160 for the held-out and defence-aware
    runs
- where: claims k2
  note: the 78 to 82% clean accuracy is a range read from Figure 4 and the text; no exact clean accuracy is given for the RAG checkpoint
- where: claims k3
  note: the 13.9% 3B average appears only in the text; it equals the mean of the four Table 8 values for the multi-framing model; the 7B 9.4% is the epoch-1 checkpoint, the final 7B checkpoint averages 10.8%
- where: defences t6
  note: the paper does not say which TRACER checkpoint was used for the mixed-evidence test (Table 6), and gives no base evidence accuracy

report:
  id: secpo_arxiv2026
  slug: '2610.41998'
  title: 'SecPO: Principled Adversarial Training for Prompt Injection Security'
  first_author: Sizhe Chen
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2610.41998'
  version_read: arXiv v1
  first_date: '2026-10-30'
  read: F
  role: proposes
  code_release: code, training data and checkpoints released (Table 7)
  extraction_scope: 'Section 4 and Appendix C.8: Tables 1 to 4 and Table 18; the abstract claims (Table 5, an image channel, Table 6, a re-run of SecOPD with this training set, Tables 8 and 17, Figure 1 and the DTaP subsets
    of Section 4.3 not coded)'
defences:
- id: secpo_l
  name: SecPO loss with online adversarial training (Llama-3.1-8B)
  origin: this_report
  base_checkpoint: Llama-3.1-8B-Instruct
  axis1:
  - chat_roles
  axis2:
  - preference_optimisation
  - distillation
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 2
  components:
  - 'SecPO loss: preferred response is the undefended model''s reply to the clean input, rejected is its reply to the injected instruction; the regulariser pulls the model on the injected input towards the undefended model
    on the clean input'
  - 'adversarial training: PAIR search (8 candidates, 30 rounds, best of 240) against the latest checkpoint for every training sample; attacker and judge are API models'
  - 19,157 Cleaned-Alpaca preference pairs; LoRA (rank 64)
  layout: 'Meta-SecAlign format: untrusted data in an added input role'
  layout_compat: &id001
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: supported
  anchor: We combine SecPO with adversarial training
  pages:
    components: 5
    isolation: 10

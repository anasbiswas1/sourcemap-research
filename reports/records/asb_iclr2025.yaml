  title: 'Agent Security Bench (ASB): Formalizing and Benchmarking Attacks and Defenses in LLM-based Agents'
  first_author: Hanrong Zhang
  venue: ICLR 2025
  peer_reviewed: 'yes'
  arxiv: '2410.02644'
  version_read: arXiv v4 (marked as published at ICLR 2025)
  first_date: '2024-10-03'
  read: F
  role: benchmark
  code_release: https://github.com/agiresearch/ASB
  extraction_scope: 'Sections 3 to 5.4 and Appendix D.2: Table 8 (defences against indirect prompt injection, all 13 LLMs: no defence, Delimiter, Instruction, Sandwich) and the matching columns of Table 19 (no-attack PNA);

report:
  id: provtransformer_arxiv2026
  slug: '2609.21088'
  title: 'Origin Is All You Need: Provenance-Aware Transformers for Structural Trust-Boundary Separation'
  first_author: Yuxuan Zhang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2609.21088'
  version_read: arXiv v1
  first_date: '2026-09-17'
  read: F
  role: proposes
  code_release: not checked
  extraction_scope: 'Section 5: Table 3 rows for no defence, Instructional, Sandwich, Random Sequence, Delimiters, SecAlign, Baseline SFT and Provenance-Aware; Tables 4 to 6; the w/o Bias rows of Table 7; the abstract claim
    (Known-Answer, PromptSleuth, DataSentinel, PromptGuard, PromptLocate and Rennervate, which detect injections, the w/o Stage 1 rows, Table 8 and the jailbreak Table 9 not coded)'
defences:
- id: pat_smol
  name: Provenance-Aware Transformer
  origin: this_report
  base_checkpoint: SmolLM2-360M
  axis1:
  - learned_token_features
  - internal_intervention
  axis2:
  - sft
  - distillation
  isolation: ablation_present
  signal_dependence: measured
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 1
  components:
  - ring ID per token (0 system, 1 operator, 2 user and trusted data, 3 untrusted data) assigned by the application
  - origin embeddings, a learnable origin attention bias indexed by query and key rings, and a learnable origin scale
  - Stage 1 origin fine-tuning on general data; Stage 2 on 60,200 SEP-style examples whose reference answers were written by Claude
  anchor: Each in- put token is assigned a ring ID encoding its origin
  pages:
    components: 9

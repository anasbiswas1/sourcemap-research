- id: secinfer_l31
  name: SecInfer
  origin: this_report
  base_checkpoint: LLaMA3.1-8B-Instruct
  axis1:
  - no_signal
  axis2:
  - prompting
  - fixed_inference_rule
  isolation: ablation_present
  signal_dependence: not_applicable
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 9
  components:
  - N = 5 candidate responses, each sampled with a chain-of-thought system prompt drawn from a set, temperature and top-k sampling
  - 'closed-domain tasks: majority over responses mapped to the output space; open-domain: clustering of response embeddings and a judge LLM (Qwen3-8B) that picks the cluster aligned with the target task'
  layout: system prompt, then the target instruction, then the data
  layout_compat:
    user_turn: supported
    separate_role: untested

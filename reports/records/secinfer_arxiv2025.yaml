report:
  id: secinfer_arxiv2025
  slug: '2509.24967'
  title: 'SecInfer: Preventing Prompt Injection via Inference-time Scaling'
  first_author: Yupei Liu
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2509.24967'
  version_read: arXiv (version not printed on the PDF)
  first_date: '2025-09-29'
  read: F
  role: proposes
  code_release: not checked
  extraction_scope: 'Sections 4 and 5.1 to 5.3: Table 2 rows No, Delimiters, Sandwich, Instructional, MetaSecAlign and SecInfer under the Combined Attack and rows MetaSecAlign and SecInfer under GCG, all six target tasks;
    Tables 5 and 6 (agents); the abstract claim (paraphrasing, retokenization, DS+PL and PromptArmor, which act outside the model, Table 1, Table 3 and the adaptive attacks of Table 8 not coded)'

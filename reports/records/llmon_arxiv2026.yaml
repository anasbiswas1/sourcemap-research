report:
  id: llmon_arxiv2026
  slug: '2610.38120'
  title: Post-Training Large Language Models with LLMON
  first_author: Basel Shbita
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2610.38120'
  version_read: arXiv v1
  first_date: '2026-10-28'
  read: F
  role: proposes
  code_release: not stated
  extraction_scope: 'Section 5: Table 2 (OPI and ASB), the Indirect column of Table 3 (ARES) and Table 1 (capability categories); the abstract claim (the Direct and Multi-turn columns of Table 3, which are direct or user-turn
    attacks, and the attention metrics of Table 4 and Figures 2 to 6 not coded)'
defences:
- id: llmon_3b
  name: LLMON post-training (SFT, GRPO, then DPO)
  origin: this_report
  base_checkpoint: Granite-4.1-3B-Base
  axis1:
  - delimiters_markers
  axis2:
  - sft
  - preference_optimisation
  isolation: no_ablation
  signal_dependence: not_reported
  trains_instruction_pair: partly
  trains_carry_through: 'no'
  page: 2
  components: &id001
  - six reserved delimiter tokens (remapped unused vocabulary slots) wrap every instruction, data, document, tool and system segment in a typed block with an identifier
  - an exec block names which instruction to run on which data; content reached through exec input (data, documents, tool results) is read, never executed
  - 'training: full SFT on a 4.6B-token LLMON corpus with distractor variants (one to three competing instructions from the pool, irrelevant data) and 130k planted-injection examples; five GRPO stages; a final DPO stage on
    about 1k on-policy injection pairs'
  layout: 'LLMON serialisation: the injected payload arrives inside a data block reached through exec input; tool results return as data blocks'
  layout_compat: &id002
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: LLMON defines six special delimiter tokens
  pages:
    components: 3
    training: 4

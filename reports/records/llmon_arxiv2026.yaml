schema_gaps:
- where: evaluations ev_*_none_*
  note: the Instruct baselines are trained by the authors on the matched chat-template corpus; the paper does not say whether they also received the 130k planted-injection examples, the GRPO stages or the final DPO stage
- where: results r_*_ares
  note: Table 3 reports robustness (1 - ASR), the opposite direction to Table 2; ID and OOD values are given only for the LLMON models
- where: claims k1
  note: the 53% lower end is the 8B Instruct baseline on ASB; capability is a mean over six categories (unchanged at 3B, 1.4 points lower at 8B), with mathematics at 8B the largest drop (84.09 to 79.63)

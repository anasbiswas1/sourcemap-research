  slug: '2507.07974'
  title: Defending Against Prompt Injection With a Few DefensiveTokens
  first_author: Sizhe Chen
  venue: AISec 2025 (ACM Workshop on Artificial Intelligence and Security)
  peer_reviewed: 'yes'
  doi: 10.1145/3733799.3762982

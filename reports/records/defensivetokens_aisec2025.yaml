- id: dt_l3
  name: DefensiveToken
  origin: this_report
  base_checkpoint: Llama3-8B-Instruct
  axis1:
  - chat_roles
  axis2:
  - soft_tokens_frozen
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 4
  components:
  - 5 new token embeddings prepended to the input, optimised with the model frozen
  - StruQ loss and StruQ defensive dataset from Cleaned Alpaca, labels generated by the undefended model
  layout: instruction in the system role, data in the user role, response in the assistant role, DefensiveTokens before the input
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: supported

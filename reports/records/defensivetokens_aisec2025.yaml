  first_date: '2025-07-10'
  read: F
  role: proposes
  code_release: linked from the abstract
  extraction_scope: 'Sections 3 and 4.1 to 4.4: the None and DefensiveToken rows of Table 3 for all four models and all eight columns, and the SecAlign-LoRA row for Llama3.1-8B-Instruct; the abstract claims (TextGrad, Reminder,
    Sandwich and StruQ rows, Figures 2 and 3, Tables 4 to 8 not coded)'

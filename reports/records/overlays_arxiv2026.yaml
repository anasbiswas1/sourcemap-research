  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 1
  anchor: small trained adapters that edit a frozen model
  components:
  - a bottleneck adapter (dimension 128) at every layer but the first adds an edit to the residual stream at token positions the serving stack marks as untrusted; the frozen model runs unchanged elsewhere
  - targets are the frozen model's own completions (on clean items, and on attacked items with the planted instruction removed), plus copy items that quote the marked span
  layout: untrusted span marked out of band (no tokens added)
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  pages:

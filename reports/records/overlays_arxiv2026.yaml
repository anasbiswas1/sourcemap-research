claims:
- id: k1
  text: against attacks written without knowledge of the defence the overlay matches the best published defences on a frozen model
  location: abstract
  anchor: AlpacaFarm attack success falls from 99.0% to 0.5%
  jobs:
  - R1
  - R2
  supported_by:
  - c_q_ov_sep
  - c_q_ov_af
  - c_q_ov_ad
  - c_q_ov_util
  page: 1
coverage:
  R1: direct
  R2clean: proxy
  R2attack: direct
  R3ns: not_reported
  R3cp: not_reported
  R3safe: not_reported
  where:
    R1: Table 1 (AlpacaFarm, Quadrat-IPI, AgentDojo, PIArena)
    R2clean: Table 1 (SEP utility)
    R2attack: Table 1 (PIArena accuracy under attack)
schema_gaps:
- where: comparisons c_l_ov_sep, c_l_ov_util
  note: for Llama, SEP is scored on a fixed 300-item subset for every row except the overlay, which uses 1,000 items, and the Llama overlay was trained on an earlier data mix (p. 6)
- where: defences ov_*
  note: training includes copy items that quote the marked span; the paper does not say whether those spans carry instructions, so trains_carry_through is coded no
- where: evaluations ev_*
  note: TensorTrust hijacking is left out because its attacker writes the user's own input; the paper notes that SEP's items resemble the training data while the other benchmarks share no attack text with it (p. 5)

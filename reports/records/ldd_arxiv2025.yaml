  role: proposes
  code_release: not checked
  extraction_scope: 'whole report (8 pages): Table 2 (attacked few-shot mean accuracy, native labels against the sentiment-associated alias group, all nine configurations); the abstract claim (the other-alias group, single
    pairs in Table 1 and the zero-shot results of Table 3 not coded)'

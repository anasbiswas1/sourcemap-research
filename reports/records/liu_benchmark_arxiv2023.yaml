report:
  id: liu_benchmark_arxiv2023
  slug: '2310.12815'
  title: Formalizing and Benchmarking Prompt Injection Attacks and Defenses
  first_author: Yupei Liu
  venue: arXiv preprint
  peer_reviewed: unknown
  arxiv: '2310.12815'
  version_read: arXiv v5 (acknowledges anonymous reviewers and a shepherd; venue not printed)
  first_date: '2023-10-19'
  read: F
  role: re_measures
  code_release: https://github.com/liu00222/Open-Prompt-Injection
  extraction_scope: 'Sections 6.1 and 6.3: Table 7 (GPT-4), the No defense, Delimiters, Sandwich prevention and Instructional prevention columns: ASV in part (a) and PNA-T in part (b) for all seven target tasks; the abstract
    claims (paraphrasing and retokenization, which change the data before an unchanged model, the detection-based defences of Table 8, MR, other LLMs and the appendix tables not coded)'
defences:
- id: delim_gpt4
  name: Delimiters
  origin: other_report
  base_checkpoint: GPT-4 (Azure OpenAI)
  axis1:
  - delimiters_markers
  axis2:
  - prompting
  isolation: not_applicable
  signal_dependence: baseline_only
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 5
  components:
  - data enclosed in delimiters so the model treats it as data
  layout: instruction prompt in the system role, data in the user role
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: untested
  anchor: Use delimiters to enclose the data to force
  pages:
    layout: 7
- id: sandwich_gpt4
  name: Sandwich prevention
  origin: other_report
  base_checkpoint: GPT-4 (Azure OpenAI)
  axis1:
  - position
  axis2:
  - prompting
  isolation: not_applicable
  signal_dependence: baseline_only
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 5
  components:
  - the instruction prompt repeated after the data
  layout: instruction prompt in the system role, data in the user role
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: untested
  anchor: Append another instruction prompt at the end of the data
  pages:
    layout: 7
- id: instr_gpt4
  name: Instructional prevention
  origin: other_report
  base_checkpoint: GPT-4 (Azure OpenAI)
  axis1:
  - no_signal
  axis2:
  - prompting
  isolation: not_applicable
  signal_dependence: baseline_only
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 5
  components:
  - instruction prompt rewritten to tell the model to ignore instructions in the data
  layout: instruction prompt in the system role, data in the user role
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: untested
  anchor: Re-design the instruction prompt to make the LLM ignore
  pages:
    layout: 7
evaluations:
- id: ev_none_dup_atk
  defence_id: none:GPT-4 (Azure OpenAI)
  benchmark: Dup. sentence detection as the target task, 100 target examples, averaged over the 7 injected tasks
  attacker_type: static
  attacker_access: black_box
  judge: 'task metric on the injected task''s label: accuracy for classification, GLEU for grammar correction, Rouge-1 for summarisation'
  layout_same_as_defence: 'yes'
  measured_by: liu_benchmark_arxiv2023
  page: 11
  attacker_budget: Combined Attack
  sample_size: 100 target x 100 injected examples
  decoding: temperature 0.1
  pages:
    benchmark: 7
    judge: 8
    decoding: 7
  baseline_kind: off_the_shelf

schema_gaps:
- where: results r_*_static and r_*_adaptive coded figure_only
  note: 'Figure 2 prints each bar''s value as a label inside a raster image, so the values cannot be checked against the page text and are not coded. Read from the image (Vicuna-7B, ASR-defense then ASR-adaptive attack): instructional
    prevention 53 and 91, data prompt isolation 50 and 94, sandwich prevention 15 and 68, adversarial fine-tuning 12 and 65; (Llama3-8B): instructional prevention 1 and 79, adversarial fine-tuning 4 and 85. Section 5.2 states
    56% (Vicuna-7B original), 12% (adversarial fine-tuning) and 9% (Llama3-8B original)'

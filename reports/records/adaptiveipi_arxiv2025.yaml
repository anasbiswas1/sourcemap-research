report:
  id: adaptiveipi_arxiv2025
  slug: '2503.00061'
  title: Adaptive Attacks Break Defenses Against Indirect Prompt Injection Attacks on LLM Agents
  first_author: Qiusi Zhan
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2503.00061'
  version_read: arXiv v2
  first_date: '2025-02-27'
  read: F
  role: re_measures
  code_release: https://github.com/uiuc-kang-lab/AdaptiveAttackAgent
  later_version: Findings of NAACL 2025, DOI 10.18653/v1/2025.findings-naacl.395 (from the search record; not read)
  extraction_scope: 'Sections 3 to 6 and Appendices A and B: the instructional prevention, data prompt isolation, sandwich prevention and adversarial fine-tuning bars of Figure 2 (InjecAgent), the numbers stated in Section
    5.2, and Table 6 (AgentDojo); the abstract claim (the three detectors and paraphrasing, which act before an unchanged model, Tables 2 to 4 and the target and valid rates not coded)'

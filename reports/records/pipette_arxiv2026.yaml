report:
  id: pipette_arxiv2026
  slug: '2611.24362'
  title: 'PIPETTE: Prompt Injection Purple-Teaming for Robust LLM Agents'
  first_author: Lipeng He
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2611.24362'
  version_read: arXiv v1
  first_date: '2026-11-18'
  read: F
  role: proposes
  extraction_scope: 'Table 6 (AgentDojo static, average over five attacks, and benign utility: None, Spotlighting, Sandwiching and PIPETTE on Qwen3-4B and Llama-3.1-8B), Tables 9 and 10 (averages: Meta-SecAlign, SecOPD and
    PIPETTE against None on AgentDojo and ASB) and Table 5 (TAP and GENETIC adaptive search); the Section 5.4 claim (PromptGuard, PIGuard, DataSentinel, MELON and CaMeL are detectors, masked re-execution and system-level isolation
    and are left out; the red-teaming tables test attackers)'

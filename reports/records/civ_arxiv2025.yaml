  extraction_scope: 'Sections 4 and 5: Table 2 rows None and CIV (Elite ASR, SoK ASR, Sim) and the Unsigned labels and Hard mask + gate rows of Table 3; the abstract claim (the guardrail comparators, which sit outside the

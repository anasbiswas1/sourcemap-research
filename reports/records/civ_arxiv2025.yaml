defences:
- id: civ_l3
  name: Contextual Integrity Verification (CIV)
  origin: this_report
  base_checkpoint: Llama-3-8B Instruct (frozen)
  axis1:
  - internal_intervention
  axis2:
  - fixed_inference_rule
  isolation: ablation_present
  signal_dependence: measured
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 8
  components:
  - every token carries an HMAC-signed trust label (SYSTEM > USER > TOOL > DOC > WEB)
  - attention from higher-trust to lower-trust tokens masked to minus infinity in 20 replaced decoder layers
  - optional gate that damps feed-forward updates of tokens with inaccessible higher-trust context
  layout: token provenance labels assigned by the serving stack; no prompt change
  layout_compat:
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  released_weights: not applicable (frozen model)
  anchor: We deploy Llama-3-8B Instruct as our baseline, surgically replacing
  signal_dependence_detail: 'Table 3: unsigned labels give 7.1% ASR and no trust propagation 3.2%, against 0% for the full system'
  pages:
    components: 7
    signal_dependence: 9
    isolation: 9

  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2608.28411'
  version_read: arXiv v1
  first_date: '2026-08-28'
  read: F
  role: benchmark
  extraction_scope: 'Tables 4 and 13 (with-attack rows) and Table 5 (OPI, InjecAgent and AgentDojo rows): No defense, Instructional, Delimiters, Sandwich, SecInfer and MetaSecAlign 8B on Llama-3.1-8B-Instruct; the Section
    5.4 claim (PromptLocate runs DataSentinel detection and span removal and the detectors of Tables 3 and 12 are left out; the without-attack rows measure the natural rate of the attacker goal, not utility)'

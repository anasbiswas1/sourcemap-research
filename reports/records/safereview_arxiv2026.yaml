  role: proposes
  extraction_scope: 'Table 2 (DeepReview, Static DPO and SafeReview under three GRPO attackers: FPR, average rating, Spearman), Table 4 (benign test set) and the System Defense and SecAlign values stated with Figure 4; the
    abstract claim (Table 1 and Table 3 test no defence; PromptGuard 2 is a detector and is left out)'

  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 1
  layout: full paper text with 8 to 12 injected instruction-style sentences; four reviews per paper, ratings averaged
  layout_compat: &id001
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  anchor: SafeReview jointly trains a Generator model to create

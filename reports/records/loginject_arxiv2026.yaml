  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2607.14493'
  version_read: arXiv v1
  first_date: '2026-07-16'
  read: F
  role: benchmark
  extraction_scope: Table 9 rows Baseline and Spotlight on GPT-4o (four objectives, overall attack success and benign accuracy); the Section 7.5 claim on spotlighting (input filtering, output validation and every combination
    containing them are left out as filter, detector and system level; Tables 6 to 8 test no defence)
defences:
- id: spot
  name: Spotlighting (log data in XML untrusted-data tags, trust-boundary instruction in the system prompt, fixed output format)

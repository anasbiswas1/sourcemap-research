  base_checkpoint: GPT-4o
  axis1:
  - delimiters_markers
  axis2:
  - prompting
  isolation: not_applicable
  signal_dependence: baseline_only
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 11
  layout: SOC analyst system prompt; log batch (50 entries) or alert with 10 related entries in the user message; payloads in log fields
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  anchor: which combines three techniques below

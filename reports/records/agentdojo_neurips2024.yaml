report:
  id: agentdojo_neurips2024
  slug: '2406.13352'
  title: 'AgentDojo: A Dynamic Environment to Evaluate Prompt Injection Attacks and Defenses for LLM Agents'
  first_author: Edoardo Debenedetti
  venue: NeurIPS 2024 Datasets and Benchmarks Track
  peer_reviewed: 'yes'
  arxiv: '2406.13352'
  version_read: arXiv v3 (carries the NeurIPS 2024 Datasets and Benchmarks footer)
  first_date: '2024-06-19'
  read: F
  role: benchmark
  code_release: https://agentdojo.spylab.ai
  extraction_scope: 'Sections 3, 4.1 and 4.3 and Appendix C: the No defense, Delimiting and Repeat prompt columns of Table 5 (GPT-4o); the abstract claim (the PI detector, a detector, and the tool filter, a system-level isolation,
    are not coded; Tables 3 and 4 and the attack ablations are attack measurements, not coded)'
defences:
- id: delim_gpt4o
  name: Data delimiters (following spotlighting)
  origin: other_report
  base_checkpoint: GPT-4o
  axis1:
  - delimiters_markers
  axis2:
  - prompting
  isolation: not_applicable
  signal_dependence: baseline_only
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 8
  components:
  - every tool output wrapped in special delimiters
  - system prompt tells the model to ignore instructions inside them
  layout: user task in the user turn, tool outputs as tool messages in the agent loop
  layout_compat:
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: we format all tool outputs with special delimiters
- id: repeat_gpt4o
  name: Prompt sandwiching (repeat the user prompt)
  origin: other_report
  base_checkpoint: GPT-4o
  axis1:
  - position
  axis2:
  - prompting
  isolation: not_applicable
  signal_dependence: baseline_only
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 8
  components:
  - the user instruction repeated after each function call
  layout: user task in the user turn, tool outputs as tool messages in the agent loop
  layout_compat:
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: which repeats the user instructions after each function call

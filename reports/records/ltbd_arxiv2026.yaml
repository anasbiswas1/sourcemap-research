schema_gaps:
- where: evaluations ev_*_struq_*, ev_*_sec_*
  note: the StruQ-Full and SecAlign-LoRA rows (and the uncoded TextGrad, Reminder, Sandwich and StruQ-LoRA rows) match the DefensiveTokens report's Table 3 value for value, at one decimal; the No Defense and DefensiveToken
    rows are at two decimals and differ from that report (Llama3-8B No Defense WinRate 33.82 here against 26.5 there). The text says the comparison is under comparable conditions and does not say the rows are copied, so measured_by
    is set to that report and the X comparisons carry unreported conditions
- where: evaluations ev_*_ltbd_spoof
  note: the Delimiter-Spoof templates are also used as training augmentations (pp. 3 and 4), so the adaptive test uses attacks the delimiters were trained on; no optimisation attack is run
- where: evaluations ev_*_ltbd_plain
  note: Table 3 does not name its benchmark; its Llama3.1-8B plain-injection ASR (0.48) differs from the Table 1 AlpacaFarm value (0.00)
- where: defences ltbd_*
  note: 'axis 2 lists both soft_tokens_frozen and preference_optimisation: only the four token embeddings are trained, with a DPO-style term in the loss'

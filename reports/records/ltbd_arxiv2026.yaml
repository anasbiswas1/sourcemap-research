report:
  id: ltbd_arxiv2026
  slug: '2610.11634'
  title: 'LTBD: Learnable Trust-Boundary Delimiters for Prompt Injection Defense'
  first_author: Luman Zhao
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2610.11634'
  version_read: arXiv v1
  first_date: '2026-10-08'
  read: F
  role: proposes
  code_release: not stated
  extraction_scope: 'Section 3: Table 1 rows No Defense, DefensiveToken, LTBD, StruQ-Full and SecAlign-LoRA for all four models and all six columns; Table 2 (ablation); Table 3 (Delimiter-Spoof); the abstract and introduction
    claims (TextGrad, Reminder, Sandwich and StruQ-LoRA rows not coded)'
defences:
- id: ltbd_l3
  name: LTBD (learnable trust-boundary delimiters)
  origin: this_report
  base_checkpoint: Llama3-8B-Instruct
  axis1:
  - delimiters_markers
  axis2:
  - soft_tokens_frozen
  - preference_optimisation
  isolation: ablation_present
  signal_dependence: measured_other_checkpoint
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 2
  signal_dependence_detail: 'Table 2: Prefix + CE trains the same four tokens as a prefix instead of at the region boundaries (a separately trained checkpoint)'
  components:
  - four new delimiter tokens [INST-START], [INST-END], [DATA-START], [DATA-END]; only their embeddings are trained, the LLM is frozen
  - 'loss: cross-entropy towards the frozen model''s own response on the clean input, plus a DPO-style term against its response on the attacked input (lambda 0.3, beta 0.1)'
  - 'training data: Cleaned Alpaca, half the samples injected with Ignore, Completion or Delimiter-Spoof'
  layout: four learned delimiter tokens wrap the trusted instruction and the untrusted data in one input sequence; chat template use not stated
  layout_compat: &id001
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  anchor: we introduce two pairs of special delimiter tokens
  pages:

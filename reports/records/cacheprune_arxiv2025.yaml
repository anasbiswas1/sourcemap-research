report:
  id: cacheprune_arxiv2025
  slug: '2504.21228'
  title: 'CachePrune: Teaching LLMs What Not to Follow via KV-Cache Editing'
  first_author: Rui Wang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2504.21228'
  version_read: arXiv v3
  first_date: '2025-04-29'
  read: F
  role: proposes
  code_release: none found in the paper
  extraction_scope: 'Sections 3 to 4.2 and Appendix A: the Vanilla and CachePrune rows of Table 1 for all three models and all columns; the abstract claims (Delimiting, Datamarking, Sandwich and Encode_Base64 rows, Tables
    2 to 6, the adaptive attacks of Appendix F and Tables 13 to 14 not coded)'
defences:
- id: cp_l3
  name: CachePrune
  origin: this_report
  base_checkpoint: LLama3-8B
  axis1:
  - internal_intervention
  axis2:
  - fixed_inference_rule
  isolation: ablation_present
  signal_dependence: stated
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 6
  components:
  - neurons in the key and value cache of the context tokens pruned (0.5% of neurons)
  - mask chosen by a preferential attribution loss on 8 examples (poisoned against clean responses)
  layout: the original prompt (Vanilla) with the context span's position known; the pruning mask applied to the context's KV cache
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  released_weights: not applicable (no weights changed)
  anchor: By default, We experiment with N = 8 for neu- ral attribution
  signal_dependence_detail: the masking requires knowing the context boundary (p. 6); no run with a wrong or missing boundary
  pages:
    isolation: 13

report:
  id: ppa_arxiv2025
  slug: '2506.05739'
  title: To Protect the LLM Agent Against the Prompt Injection Attack with Polymorphic Prompt
  first_author: Zhilong Wang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2506.05739'
  version_read: arXiv v1
  first_date: '2025-06-06'
  read: F
  role: proposes
  code_release: https://github.com/zhilongwang/LLMAgentProtector
  later_version: DSN 2025 supplemental volume, DOI 10.1109/dsn-s65789.2025.00037 (from the search record; not read)
  extraction_scope: 'whole report (7 pages): Table II coded (overall ASR per model and the twelve attack rows); the abstract claim (Table I, a prompt-wording ablation on GPT-3.5, and the detector-benchmark accuracies of Tables
    III and IV not coded)'
defences:
- id: ppa_g35
  name: Polymorphic Prompt Assembling (PPA)
  origin: this_report
  base_checkpoint: GPT-3.5-Turbo
  axis1:
  - delimiters_markers
  axis2:
  - prompting
  - fixed_inference_rule
  isolation: not_applicable
  signal_dependence: not_reported
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 3
  components:
  - user input wrapped in a separator pair drawn at random per request from 84 separators refined by a genetic algorithm
  - system prompt template drawn at random, naming the separators and telling the model to ignore instructions inside them
  layout: system prompt naming the separators, then the user input between them
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  anchor: The workflow of Polymorphic Prompt Assembling
  pages:
    components: 4

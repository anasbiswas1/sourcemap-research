claims:
- id: k1
  text: AdvSim2Real raises completion under an unseen frontier-model adversary by 33.6% relative to the base agent
  location: abstract
  anchor: raises com- pletion under this unseen adversary by 33.6% relative
  jobs:
  - R2
  supported_by:
  - c_robust3_kimi
  - c_robust3_v1
  - c_robust3_clean
  page: 1
coverage:
  R1: not_reported
  R2clean: direct
  R2attack: direct
  R3ns: not_reported
  R3cp: not_reported
  R3safe: not_reported
  where:
    R1: attack success is not reported; the adversary's success flips are a training reward
    R2clean: Table 1 (clean)
    R2attack: Tables 1 and 3 (completion under injection)
schema_gaps:
- where: evaluations ev_*
  note: all coded results are measured inside a frozen web world model with an LLM judge, not in a real browser; the browser runs of Table 2 cover clean capability only (p. 8)
- where: evaluations ev_*_v1, ev_*_v2, ev_*_v3
  note: Adv v1 to v3 were trained against the Robust lineage, so they are adaptive for Robust iter 3 and transferred for Base and Capability iter 3

report:
  id: advsim2real_arxiv2026
  slug: '2610.08773'
  title: 'AdvSim2Real: Training Web Agents Against Adaptive Prompt Injection in a Web World Model'
  first_author: Sarim Hashmi
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2610.08773'
  version_read: arXiv v1
  first_date: '2026-10-06'
  read: F
  role: proposes
  code_release: stated as released in the abstract; not checked
  extraction_scope: 'Section 5: Table 1 rows Base, Capability iter 3 and Robust iter 3 (clean and Adv v1 to v3) and Table 3 rows Base and Robust iter 3 (Kimi-K3 adversary); the abstract claim (the other checkpoints, the hosted
    9B reference, Table 2 browser runs, which test capability only, and the ablations not coded)'
defences:
- id: robust3
  name: 'AdvSim2Real (Robust iter 3: curriculum, then adversary-executor co-evolution)'
  origin: this_report
  base_checkpoint: Qwen3.5-4B
  axis1:
  - no_signal
  axis2:
  - adversarial_rl
  isolation: ablation_present
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 1
  components:
  - 'Stage 1: a curriculum model proposes tasks the agent solves about half the time; the agent trains on fresh rollouts in the world model'
  - 'Stage 2: an adversary is rewarded only for success flips (a judged success turned into a failure by one timed injection); the agent trains on new and earlier attacks plus clean tasks'
  - LoRA per role, group-normalised advantages
  layout: web agent acting on pages predicted by a frozen web world model (WebWorld-14B); injections appear in the page
  layout_compat: &id001
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: co-evolves a task curriculum, an injection adversary, and the agent
  pages:
    components: 6
- id: cap3
  name: AdvSim2Real Stage 1 only (Capability iter 3, no injections in training)
  origin: this_report
  base_checkpoint: Qwen3.5-4B

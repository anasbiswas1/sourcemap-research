report:
  id: redvisor_arxiv2026
  slug: '2602.01795'
  title: 'RedVisor: Reasoning-Aware Prompt Injection Defense via Zero-Copy KV Cache Reuse'
  first_author: Mingrui Liu
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2602.01795'
  version_read: arXiv v1
  first_date: '2026-02-02'
  read: F
  role: proposes
  code_release: anonymous repository linked in a footnote (p. 2); not checked
  extraction_scope: 'whole report (23 pages): Table 3 (Alpaca-Farm ASR) for the undefended model, Sandwich, StruQ, SecAlign and RedVisor on all three backbones; the three win rates printed in the text of Section 7.6 with the
    other Figure 3 bars as figure_only; the GCG-classifier rows of Table 4; the abstract and introduction claims. Left out: PromptArmor, PromptLocate and DataFilter, which detect or rewrite before an unchanged model; detection
    scores (Tables 2, 5, 6); Table 7 (RedVisor guarding a GPT-4o agent); Table 8 (NQ-simplified); Table 9 (adapter ablation); latency'
defences:
- id: rv_l
  name: RedVisor
  origin: this_report
  base_checkpoint: Llama-3-8B-Instruct
  axis1:
  - delimiters_markers
  axis2:
  - sft
  - fixed_inference_rule
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 4
  components:
  - user query and context in <user query> and <reference context> tags, context split into indexed sentences (p. 3)
  - gated self-attention adapter (about 70M parameters) on the top layer of the frozen backbone, trained to write a reasoning trace that locates injected sentences (templates filled by a spaCy intent extractor)
  - 'phase 2: adapter muted, transition instruction appended, frozen backbone answers with the reasoning trace in context'
  layout: inspection prefix as the first user message, then the tagged user query and context
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  anchor: we position our adapter exclusively at the top layer
  pages:
    components: 3
    layout: 4
    layout_compat: 22

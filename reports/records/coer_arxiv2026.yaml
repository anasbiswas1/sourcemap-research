  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 6
  layout: agent loop over AgentDojo and AgentDyn suites; tool outputs carry the injection
  layout_compat: *id001
  anchor: CoER adds population-guided
  components:
  - defender and attacker co-trained as a general-sum Markov game with PPO; the attacker may inject several times within an execution
  - historical populations of both roles sampled during training
  - Defender SFT on 5,760 verified safe trajectories from GLM-5.2 and DeepSeek V4 Pro under the retained attackers
  pages:
    components: 6

schema_gaps:
- where: report
  note: the paper's headline defence, Constitutional Sanitization, redacts suspicious spans before the model sees them and is left out as a sanitiser; the SFT targets were themselves produced under sanitisation, so the coded
    SFT defence distils that pipeline
- where: results r_*_asr
  note: Table III prints counts with Wilson intervals; the abstract gives the No Defense rates (86.50% Qwen, 54.83% Llama)

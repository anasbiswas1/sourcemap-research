report:
  id: gemini_arxiv2025
  slug: '2505.14534'
  title: Lessons from Defending Gemini Against Indirect Prompt Injections
  first_author: Chongyang Shi
  venue: arXiv preprint (technical report)
  peer_reviewed: 'no'
  arxiv: '2505.14534'
  version_read: arXiv v1
  first_date: '2025-05-20'
  read: F
  role: mixed
  code_release: none (closed model)
  extraction_scope: 'Sections 5.3, 7 to 9.2 and Appendices D and E: the ICL, Spotlighting and Warning rows of Tables 3 and 4 (Gemini 2.0), Table 1 (Gemini 2.5 against 2.0), the non-adaptive Gemini 2.5 result and the Warning
    plus Gemini 2.5 result in Sections 9.1 and 9.2; the abstract claim (paraphrasing and the classification defences, Table 2''s undefended runs, Appendices F to H not coded)'
defences:
- id: aft_g25
  name: Adversarial fine-tuning of Gemini (SFT on corrected responses, with RL adversarial training)
  origin: this_report
  base_checkpoint: Gemini 2.5 (Gemini-2.5-Flash-Preview-04-17 named for the leaderboard score)
  axis1:
  - no_signal
  axis2:
  - sft
  - adversarial_rl
  isolation: no_ablation
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 20
  components:
  - conversations with tool calls and private data, injected with triggers from the automated red-teaming attacks
  - corrective responses produced with the Warning defence and filtered by the user instruction classifier
  - supervised fine-tuning, with reinforcement learning adversarial training applied alongside
  layout: conversation history with tool calls; the retrieved tool output carries the trigger
  layout_compat: &id001
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: supported
  released_weights: no (closed model)
  anchor: Synthesizing Corrective Responses

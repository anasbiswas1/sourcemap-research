  first_date: '2026-06-09'
  read: F
  role: proposes
  code_release: not checked
  extraction_scope: 'Sections 4 to 6 and Appendix D: Table 15 rows for the four pairs where the lower level is data or tool output (L0 to L3 against L4), the ORR row of Table 1 and the probe-execution row of Table 24 (SEP);

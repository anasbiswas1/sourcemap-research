report:
  id: localalign_ccs2026
  slug: '2605.01462'
  title: 'LocalAlign: Enabling Generalizable Prompt Injection Defense via Generation of Near-Target Adversarial Examples for Alignment Training'
  first_author: Yuyang Gong
  venue: CCS 2026
  peer_reviewed: 'yes'
  doi: 10.1145/3830454.3846553
  arxiv: '2605.01462'
  version_read: arXiv v2 (carries the CCS 2026 header)
  first_date: '2026-05-02'
  read: F
  role: proposes
  code_release: GitHub repository mentioned in Appendix B; not checked
  extraction_scope: 'Sections 4 and 5 and Appendix B: Table 1 (out-of-distribution ASR, both models), Table 2 (AlpacaFarm ASR) and Table 3 (utility); the abstract claims (the ablations of Tables 4 to 6, Figure 3 and the PISmith
    averages in Appendix B not coded)'
defences:
- id: la_l
  name: LocalAlign
  origin: this_report
  base_checkpoint: Llama3.1-8B-Instruct
  axis1:
  - chat_roles
  axis2:
  - preference_optimisation
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 8
  components:
  - warm-up with Meta-SecAlign-style preference data from Cleaned Alpaca
  - near-target injected commands written by the defended model itself with one prompt (same task family, same data, a different answer)
  - 'margin-aware DPO: per-batch DPO coefficient raised for samples whose wrong answer is close to the correct one'
  - LoRA rank 64
  anchor: we fine-tune the model on the generated adversarial examples
  pages:
    components: 14
- id: la_q
  name: LocalAlign
  origin: this_report

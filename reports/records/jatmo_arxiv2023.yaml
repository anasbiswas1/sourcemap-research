report:
  id: jatmo_arxiv2023
  slug: '2312.17673'
  title: 'Jatmo: Prompt Injection Defense by Task-Specific Finetuning'
  first_author: Julien Piet
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2312.17673'
  version_read: arXiv v2
  first_date: '2023-12-29'
  read: F
  role: proposes
  code_release: https://github.com/wagner-group/prompt-injection-defense
  later_version: Springer book chapter, DOI 10.1007/978-3-031-70879-4_6 (from the search record; not read)
  extraction_scope: 'Sections 4 and 5.1 to 5.2: Table 2 (all seven tasks, three injection positions) and the 98% quality statement in Section 5; the abstract claims (Sections 5.3 to 5.4, Figures 4 and 5 and the appendix not
    coded)'
defences:
- id: jatmo_davinci002
  name: Jatmo
  origin: this_report
  base_checkpoint: davinci-002 (non-instruction-tuned base model)
  axis1:
  - no_signal
  axis2:
  - sft
  - distillation
  isolation: no_ablation
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 11
  components:
  - one task-specific model per task, fine-tuned from a base model that was never instruction-tuned
  - training outputs generated by the teacher GPT-3.5-Turbo from the task prompt and each input (real or synthetic inputs)
  layout: the task input alone; no instruction at inference
  layout_compat:
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  released_weights: code released; models not checked
  anchor: We build each task-specific model by fine-tuning davinci-002
  pages:
    components: 10

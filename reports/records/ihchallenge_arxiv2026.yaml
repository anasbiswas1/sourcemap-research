  title: 'IH-Challenge: A Training Dataset to Improve Instruction Hierarchy on Frontier LLMs'
  first_author: Chuan Guo
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2603.10521'
  version_read: arXiv v1
  first_date: '2026-03-11'
  read: F
  role: proposes
  code_release: dataset released (huggingface.co/datasets/openai/ih-challenge, linked from the abstract); training code not released
  extraction_scope: 'Sections 3 and 4: Table 5 (prompt injection) and Table 2 (overrefusal and capability); the abstract claim (Tables 3 and 4, which test conflicts between system, developer and user messages rather than injected
    data, Figures 4 to 6, Table 6 and Table 7 not coded)'
defences:
- id: ihc_g5m
  name: GPT-5-Mini-R (RL on IH-Challenge with online adversarial attacks)
  origin: this_report
  base_checkpoint: GPT-5-Mini
  axis1:
  - chat_roles
  axis2:
  - adversarial_rl
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 6
  components:
  - task skeletons with higher-priority instructions and Python graders (Single-Constraint, Multi-Constraint, Input-Conditioned, Anti-Overrefusal)
  - a frozen attacker model writes the lower-priority conflicting message online against the current defender, under a tool-call budget
  - policy-gradient updates on grader rewards, mixed with capability tasks
  layout: priority order system, developer, user, tool
  released_weights: no (closed model)
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: supported
    agent_tool_result: supported
  anchor: We train the defender using RL, where at each step we synthesize
  pages:
    layout: 4
    layout_compat: 10

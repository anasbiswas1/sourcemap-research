report:
  id: secopd_emnlp2026
  slug: '2608.21500'
  title: 'SecOPD: Mitigating Adaptive Prompt Injections by On-Policy Distillation'
  first_author: Yibo Peng
  venue: EMNLP 2026 (accepted, as printed on p. 1)
  peer_reviewed: 'yes'
  doi: 10.18653/2026.emnlp-main.1102
  arxiv: '2608.21500'
  version_read: arXiv v1 (carries an EMNLP 2026 acceptance note)
  first_date: '2026-08-21'
  read: F
  role: proposes
  code_release: https://github.com/pppyb/SecOPD and released weights (linked from the abstract)
  extraction_scope: 'Section 5: Tables 1 and 2 (all four models, all columns); the abstract claims (the static attack breakdown of Table 7, the per-domain AgentDojo Table 6 and the judge audits not coded)'
defences:
- id: secopd
  name: SecOPD (secure on-policy distillation)
  origin: this_report
  base_checkpoint: Qwen3.6-27B
  axis1:
  - chat_roles
  axis2:
  - distillation
  isolation: no_ablation
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 1
  components:
  - trusted prompt in the user role, untrusted data in a separate input role
  - on injected samples the model's own rollout is scored token by token by the initial model given the clean input (reverse KL)
  - 19K samples built from Cleaned-Alpaca
  layout: user role for the instruction, input role for the data
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: supported
  anchor: we propose Secure On-Policy Distillation (SecOPD) that provides
  pages:
    components: 6
    layout: 2
- id: msa_q
  name: Meta-SecAlign (trained by the authors on the same 19K data)
  origin: other_report
  base_checkpoint: Qwen3.6-27B
  axis1:
  - chat_roles
  axis2:
  - preference_optimisation
  isolation: not_applicable
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 6
  anchor: all defended mod- els are fine-tuned using a 19K dataset
- id: grpo_q
  name: GRPO baseline (sequence-level judge reward on injected samples)
  origin: this_report
  base_checkpoint: Qwen3.6-27B
  axis1:
  - chat_roles
  axis2:
  - preference_optimisation
  isolation: not_applicable
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 6
  anchor: We use GRPO as a baseline for sequence-level

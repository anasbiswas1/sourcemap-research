- id: k1
  text: the reasoning guardrail reduced attack success on most models by an average of 23.0 points but backfired on the smallest model (5.5% to 55.3%)
  location: abstract
  anchor: The reasoning guardrail sharply reduced successful attacks on most models
  jobs:
  - R1
  supported_by:

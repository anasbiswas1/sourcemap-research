claims:
- id: k1
  text: defence training destroys agent competence while failing to stop sophisticated attacks
  location: abstract
  anchor: defense training designed to improve safety systematically destroys agent competence
  jobs:
  - R1
  - R2
  supported_by:
  - c_ag_l3_struq
  - c_ag_l3_secalign
  - c_ag_mi_struq
  - c_ag_mi_secalign
  - c_cs_l3_struq_adv

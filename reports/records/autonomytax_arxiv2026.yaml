  page: 1
  contradicted_by:
  - r_ag_l31_msa_normal
  - r_ag_l31_msa_cr
coverage:
  R1: proxy
  R2clean: proxy
  R2attack: not_reported
  R3ns: not_reported
  R3cp: not_reported
  R3safe: not_reported
  where:
    R1: Tables 3 and 8 (refusal of a mixed set of direct requests and embedded instructions)
    R2clean: Table 1 (valid first action before any tool output); completion with trigger phrases is coded other
schema_gaps:
- where: evaluations ev_ag_*
  note: completion rate is measured with attack-like trigger phrases, not attacks, added to 30% of tool observations, so it is coded other; the step-1 rate is measured before any tool output and is coded as a clean-utility
    proxy
- where: evaluations ev_cs_*, ev_t8_*
  note: the adversarial prompts are mostly direct requests (social engineering, obfuscation) with some instructions embedded in task text, and success is counted as not refusing, so R1 is a proxy (pp. 4, 16)
- where: comparisons c_cs_msa_*
  note: Table 3 lists Meta SecAlign and Base-Llama3.1-8B in the n = 350 subset table, but Appendix A.7 says the Meta SecAlign runs used a 1,000-prompt set, Table 4 uses another attack taxonomy for it, and Table 8's input-role
    TPR (79.6%) equals Base-Llama3.1-8B's Table 3 TPR; the denominator is marked unreported (pp. 6, 18, 19)
- where: defences struq_*, secalign_*
  note: 'both are the authors'' re-implementations: StruQ with <inst>/<obs> tags and weighted instruction tokens; SecAlign trained to prefer refusals on 30K agent triples, not the original SecAlign objective (p. 17)'

  title: 'ASIDE: Architectural Separation of Instructions and Data in Language Models'
  first_author: Egor Zverev
  venue: ICLR 2026
  peer_reviewed: 'yes'
  arxiv: '2503.10566'
  version_read: arXiv v4 (marked as published at ICLR 2026)
  first_date: '2025-03-13'
  read: F
  role: proposes
  code_release: not checked in this pass
  extraction_scope: Sections 4 and 5.1; Llama 3.1 8B and Mistral 7B v0.3 rows of Tables 1 and 3 (other models, direct-injection columns and Section 6 not coded in the pilot)
defences:
- id: aside_llama31_8b
  name: ASIDE
  origin: this_report
  base_checkpoint: Llama 3.1 8B (pretrained), instruction-tuned by the authors
  axis1:
  - fixed_embedding_transform
  axis2:
  - sft
  components:
  - fixed orthogonal rotation of the embeddings of data tokens
  - standard instruction tuning without injected examples
  isolation: ablation_present
  layout: 'Alpaca template: instruction with the template''s system prompt in the instruction part; the input and any injection go through the rotated data embedding'
  signal_dependence: measured_other_checkpoint
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: untested
  released_weights: not checked in this pass
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 4
  anchor: we apply a fixed (i.e., not learnable) orthogonal rotation
  signal_dependence_detail: rotation-angle ablation on Qwen3-8B only (Figure 7, values in the figure)
  pages:
    signal_dependence: 17
- id: aside_mistral7b
  name: ASIDE
  origin: this_report

report:
  id: autodojo_arxiv2026
  slug: '2606.15057'
  title: 'AutoDojo: A Generative Benchmark for Evaluating Prompt Injection Defenses in LLM Agents'
  first_author: Xinhang Ma
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2606.15057'
  version_read: arXiv v3
  first_date: '2026-06-13'
  read: F
  role: benchmark
  code_release: https://github.com/xhOwenMa/AutoDojo (linked from the abstract)
  extraction_scope: 'Section 4 and Appendices D and H: Table 5 (AgentDojo, five models) and Table 8 (AgentDyn, two models), rows No defense, Reminder and Spotlighting; the abstract claim (PromptGuard, PIGuard, ProtectAI and
    DataFilter, which filter tool outputs, and Progent, DRIFT, CaMeL and ROPE, which are system-level designs, are left out; per-suite and per-bucket Tables 6, 7, 9 and 10 and the comparison with other adaptive attacks not
    coded)'

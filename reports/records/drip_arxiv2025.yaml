report:
  id: drip_arxiv2025
  slug: '2511.00447'
  title: 'DRIP: Defending Prompt Injection via Token-wise Representation Editing and Residual Instruction Fusion'
  first_author: Ruofan Liu
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2511.00447'
  version_read: arXiv v2
  first_date: '2025-11-01'
  read: F
  role: proposes
  code_release: demo site cited; code not checked
  later_version: DOI 10.1145/3830454.3832577 (from the search record; not read)
  extraction_scope: 'Sections 3 and 4.1 to 4.3: the Undefended, SecAlign and Ours rows of Tables 3, 4 and 6 and the Naive, Hackaprompt, GCG and NeuralExec rows of Table 5; the abstract claims (StruQ, ISE and PFT rows, family
    averages of Table 5, Figure 8, Table 7 ablation and Appendix tables not coded)'
defences:
- id: drip_l8
  name: DRIP
  origin: this_report
  base_checkpoint: LLaMA-8B (as printed; Llama 3 chat template)
  axis1:
  - chat_roles
  - learned_token_features
  - internal_intervention
  axis2:
  - preference_optimisation
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: partly
  trains_carry_through: yes_by_preference
  page: 6
  components:
  - 'de-instruction shift: a learned token-wise linear edit of the data tokens'' embeddings'
  - 'instruction fusion: the last instruction token''s hidden state added to the output state before the LM head'
  - 'DPO with LoRA on curated SEP-train pairs: injected tasks resampled from SQuAD so the same instruction strings also appear as top-level instructions with other data'
  - preferred responses process the whole data section, the injected sentence included (Figure 4 translates it; the prompt adds a do-not-omit instruction)
  layout: instruction in the system turn, data in the user turn, response in the assistant turn
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: supported
  released_weights: not stated
  anchor: 'Experiments use two widely adopted decoder-only backbones: LLaMA-8B [19] and Mistral-7B'
  pages:
    components: 4
    trains_instruction_pair: 5
    trains_carry_through: 6
    layout: 5
    isolation: 12

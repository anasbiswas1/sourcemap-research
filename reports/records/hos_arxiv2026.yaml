schema_gaps:
- where: defences sec_g
  note: the paper sweeps SecAlign learning rates on GPT-OSS-20B (Table 13) but does not say which checkpoint Tables 1 and 2 use; the headline HoS GPT-OSS model is learning rate 0.1 (p. 35)
- where: comparisons c_*_own_*
  note: each arm is attacked by an RL-Hammer attacker trained against it, so the attacker differs by design; the authors note the HoS-trained attacker got sparse reward (3.2% training ASR) and the SecAlign-trained attacker
    is stronger against HoS, which the max rows capture
- where: claims k3
  note: the headline HoS GPT-OSS model loses clean utility on AgentDyn (41.67 against 58.33) and WASP (41.62 against 56.22); Llama HoS loses 15.4 points of AgentDyn clean utility while Meta-SecAlign-70B gains 8.0 (Table 3)
- where: report
  note: the white-box claim (about three times more compute to reach 50% ASR) rests on Figure 2 curves and is not coded; the LLMail utility and multi-turn AlpacaFarm judge is Claude Sonnet 5 (Appendices G and I); the attack
    names Claudini and claudini_v45 are the paper's
- where: evaluations ev_l_*_static
  note: Table 12 shows that under SecAlign's own InjecAgent protocol Meta-SecAlign-70B gives invalid ReAct outputs on 90 to 95% of cases; the coded static rows use the authors' native tool protocol

  title: 'Heads of Security: Learned Attention Gates Improve Prompt Injection Robustness'
  first_author: Igor Shilov
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2610.37657'
  version_read: arXiv v2
  first_date: '2026-10-27'
  read: F
  role: proposes
  code_release: imperial-aisp/heads_of_security, demo and released gates (p. 1)
  extraction_scope: 'Sections 4 and 5 and Appendices F, G and J: Table 1 (static, own-attacker and highest RL-Hammer rows for the undefended, SecAlign and HoS models), Table 2, Table 3, Table 13 (stable learning rates), Table
    4 and the white-box counts stated in Appendix F.2; the abstract claims (the GPT-5.6-Luna column, Figure 2 compute curves, Figure 3, Table 12, Table 14 and Figures 5 to 9 not coded)'

  - internal_intervention
  axis2:
  - preference_optimisation
  - distillation
  isolation: ablation_present
  signal_dependence: stated
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 4
  components: &id002
  - 'each token gets a channel: trusted (system, user, the model''s own output), untrusted (tool outputs) or template (chat-template tokens)'
  - a learned bias per head and per query-key channel pair is added to the attention logits (log sigmoid of a gate logit); base weights frozen
  - trained with the SecAlign++ DPO recipe on Cleaned-Alpaca injection pairs
  layout: native tool calling; every tool-output token assigned to the untrusted channel

claims:
- id: k1
  text: SecureCAI lowers attack success by 94.7% against the base model while keeping clean accuracy
  location: abstract
  anchor: reduces attack success rates by 94.7% compared
  jobs:
  - R1
  - R2
  supported_by:
  - c_nosan_pool
  - c_nosan_clean
  page: 1
coverage:
  R1: direct
  R2clean: direct
  R2attack: not_reported
  R3ns: not_reported
  R3cp: not_reported
  R3safe: not_reported
  where:
    R1: Table 2 (Log, Email, Malware); Table 4 pooled (proxy)
    R2clean: Tables 3 and 4
    R2attack: not reported
schema_gaps:
- where: claim k1
  note: the 94.7% figure is for the full system, which includes input sanitisation; the in-scope comparison is the ablation without the sanitiser, whose attack success is only given pooled over all six categories, including
    direct injection
- where: report
  note: the base model is described only as a 7B pre-trained model and the training and test data as collected from operational environments; which model the Instruction Hierarchy prompt runs on is not stated and is taken
    to be the same base

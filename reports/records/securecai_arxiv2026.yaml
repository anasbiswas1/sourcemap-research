report:
  id: securecai_arxiv2026
  slug: '2601.07835'
  title: 'SecureCAI: Injection-Resilient LLM Assistants for Cybersecurity Operations'
  first_author: Mohammed Himayath Ali
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2601.07835'
  version_read: arXiv v1
  first_date: '2026-01-12'
  read: F
  role: proposes
  extraction_scope: Table 2 columns Log, Email and Malware (injections carried in security artifacts) for the base model, Standard CAI and Instruction Hierarchy; Table 3 clean averages; Table 4 row 'w/o Input Sanit.' (SecureCAI
    without its sanitiser); the abstract claim (full SecureCAI includes input sanitisation and Input Filtering is a detector, both left out; the Direct, Overflow and Backdoor columns are direct injection, context truncation
    and trigger backdoors)

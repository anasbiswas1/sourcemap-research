report:
  id: metasecalign_arxiv2025
  slug: '2507.02735'
  title: 'Meta-SecAlign: Training LLMs against Prompt Injection for Robust Agents'
  first_author: Sizhe Chen
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2507.02735'
  version_read: arXiv v4
  first_date: '2025-07-03'
  read: F
  role: proposes
  code_release: training and evaluation code stated as public (p. 2); not checked
  extraction_scope: 'Sections 3 and 4.1 to 4.3 and Appendices A and B: the Llama-3.3-70B-Instruct Undef., SecAlign and Ours columns of Tables 3 and 4, the GCG row of Table 5 (8B and 70B), and the randomized-position columns
    of Table 1 for AgentDojo utility and AlpacaFarm ASR; the abstract claims (Table 2, commercial-model columns, Table 6, Appendices C to F not coded)'
defences:
- id: msa_70b
  name: Meta-SecAlign
  origin: this_report
  base_checkpoint: Llama-3.3-70B-Instruct
  axis1:
  - chat_roles
  axis2:
  - preference_optimisation
  isolation: ablation_present
  signal_dependence: stated
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 6
  name_as_printed: Meta-SecAlign-70B
  components:
  - added input role for the data
  - SecAlign simulated injections at a randomized position
  - self-generated preferred and rejected responses from the initial model
  - DPO with LoRA on Cleaned-Alpaca (19157 pairs)
  layout: instruction in the user role, data in an added input role, Llama chat template
  layout_compat:
    user_turn: untested
    separate_role: supported
    system_context: untested
    agent_tool_result: supported
  released_weights: defended models stated as released under commercial licences (p. 2)

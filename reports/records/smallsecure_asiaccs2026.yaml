report:
  id: smallsecure_asiaccs2026
  slug: doi_10_1145_3779208_3804880
  title: 'POSTER: Small but Secure: Distilling SecAlign Defense on Edge LLMs via On-Policy RL'
  first_author: Debasmita Dey
  venue: ASIA CCS 2026 (poster)
  peer_reviewed: 'yes'
  doi: 10.1145/3779208.3804880
  version_read: ACM published version
  first_date: '2026-06-01'
  read: F
  role: proposes
  code_release: not stated
  extraction_scope: 'Section 4: Table 1 (all columns and rows); the abstract claim'
defences:
- id: onp
  name: on-policy RL distillation of Meta-SecAlign-8B into a 1B student (reverse-KL advantage, PPO clipping)
  origin: this_report
  base_checkpoint: Llama-3.2-1B-Instruct
  axis1:
  - no_signal
  axis2:
  - distillation
  isolation: ablation_present
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 2
  components:
  - student samples responses to injected SecAlign-style inputs; teacher log-probabilities on the same tokens give a per-token negative reverse KL as the advantage
  - PPO-style clipped importance-sampling update, LoRA rank 4, 1,000 training samples, three epochs
  layout: Alpaca-style instruction with data, Llama-3.2 chat template; how instruction and data are separated is not described further
  layout_compat: &id001
    user_turn: untested
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  anchor: We apply the on-policy RL distillation framework for transferring
  pages:
    components: 2
- id: kd
  name: standard knowledge distillation from Meta-SecAlign-8B (forward KL on teacher logits, fixed data)
  origin: this_report
  base_checkpoint: Llama-3.2-1B-Instruct
  axis1:
  - no_signal
  axis2:
  - distillation
  isolation: not_applicable
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 3
  layout: Alpaca-style instruction with data, Llama-3.2 chat template; how instruction and data are separated is not described further
  layout_compat: *id001
  anchor: Standard Distillation. We minimize forward KL divergence
- id: msa8
  name: Meta-SecAlign-8B (released checkpoint, the teacher)
  origin: other_report

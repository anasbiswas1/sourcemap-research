report:
  id: instrucot_arxiv2026
  slug: '2601.04666'
  title: 'Know Thy Enemy: Securing LLMs Against Prompt Injection via Diverse Data Synthesis and Instruction-Level Chain-of-Thought Learning'
  first_author: Zhiyuan Chang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2601.04666'
  version_read: arXiv v2
  first_date: '2026-01-08'
  read: F
  role: proposes
  code_release: not stated in the paper
  later_version: an ACL 2026 presentation record exists on Underline (doi 10.48448/3zdt-ax45); the arXiv v2 was read
  extraction_scope: 'Appendix J Table 6 (indirect prompt injection, Behavior Deviation set, each of the four backbones): the AVG row and the TopicAttack row for Clean, ISE, MetaSec, IP, InSFT and InstruCoT; the abstract claim
    and the InSFT contrast (PromptArmor is a GPT-4 detector that removes injected text and is left out; Table 3 pools the four models; direct injection in Table 5, system-prompt extraction in Table 7 and jailbreak harmful
    requests in Table 8 are out of scope; the utility radar chart in Figure 4 is not coded)'
defences:
- id: ic_l3
  name: InstruCoT (diverse injection synthesis with instruction-level chain-of-thought fine-tuning)
  origin: this_report
  base_checkpoint: Llama3-8B
  axis1:
  - no_signal
  axis2:
  - sft
  - distillation
  isolation: ablation_present
  signal_dependence: not_applicable
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 5
  components:
  - injected instructions synthesised for three threat scenarios (behaviour deviation, privacy leakage, harmful output) and placed into four context regions (user, data, user and data, empty)
  - instruction-aware chain of thought (perceive each instruction, judge whether it violates the system prompt, project a response) generated by GPT-4.1 for adversarial and clean samples
  - full-parameter supervised fine-tuning on the chain of thought followed by the original clean response, or a standard refusal for empty context
  layout: system prompt followed by context regions (user, data, or both); injected instructions placed in the user region, the data region or both
  layout_compat: &id001
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  anchor: InstruCoT trains the backbone LLM to follow this generation paradigm
  pages:
    components: 4

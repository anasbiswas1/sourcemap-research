report:
  id: pismith_colm2026
  slug: '2603.13026'
  title: 'PISmith: Reinforcement Learning-based Red Teaming for Prompt Injection Defenses'
  first_author: Chenlong Yin
  venue: COLM 2026
  peer_reviewed: 'yes'
  arxiv: '2603.13026'
  version_read: arXiv v2 (carries the COLM 2026 header)
  first_date: '2026-03-13'
  read: F
  role: re_measures
  code_release: https://github.com/albert-y1n/PISmith (linked from the abstract)
  extraction_scope: 'Sections 4.1 to 4.3 and Appendix E: Table 7 rows No Defense, Sandwich and Instructional (Qwen3-4B-Instruct-2507, means over the 13 PIArena benchmarks) and the Average row of Table 1 (Meta-SecAlign-8B,
    which has no undefended arm in the paper); the abstract claim (PromptArmor and DataFilter, which rewrite the data, and PIGuard, PromptGuard and DataSentinel, which are detectors, are left out; per-benchmark Tables 8 to
    15, the agent results of Tables 2, 3 and 5 and the ablations not coded)'

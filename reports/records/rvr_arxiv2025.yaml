report:
  id: rvr_arxiv2025
  slug: '2504.20472'
  title: 'Robustness via Referencing: Defending against Prompt Injection Attacks by Referencing the Executed Instruction'
  first_author: Yulin Chen
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2504.20472'
  version_read: arXiv v2
  first_date: '2025-04-29'
  read: F
  role: proposes
  code_release: stated as public in a footnote; not checked
  later_version: Findings of ACL 2026, DOI 10.18653/v1/2026.findings-acl.61 (from the search record; not read)
  extraction_scope: 'Sections 4 and 5.1 to 5.3 and Appendix B: the None, StruQ and Ours rows of Table 2 (Inj-SQuAD, indirect) and the None and Ours rows of Table 3; the abstract claims (Table 1 direct scenario, other prompting
    baselines, Tables 4 to 6 and 9 to 12 not coded)'
defences:
- id: rvr_l3
  name: Robustness via Referencing (instruction referencing with filtering)
  origin: this_report
  base_checkpoint: Llama3-8B-Instruct
  axis1:
  - delimiters_markers
  axis2:
  - prompting
  - fixed_inference_rule
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: not_applicable
  trains_carry_through: not_applicable
  page: 4
  components:
  - data split into lines of at most K words, each prefixed with a tag [L X]; the instruction placed as line 1
  - instruction and data enclosed in <Instruction Area> and <Data Area> markers
  - prompt asks the model to name the tag and instruction it executes for each answer; two in-context examples
  - filter keeps only the answer referencing [L 1]
  layout: 'one prompt: instruction area, then the tagged data lines in a data area'
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  anchor: The entire defense pipeline consists of three se- quential steps
  pages:
    components: 5
    isolation: 17

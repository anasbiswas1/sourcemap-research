- id: reta_q
  name: RETA
  origin: this_report
  base_checkpoint: Qwen3-4B-Instruct-2507
  axis1:
  - no_signal
  axis2:
  - sft
  - preference_optimisation
  isolation: ablation_present
  signal_dependence: not_reported
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 1
  components:
  - at each tool-output step the defender reasons whether its next action serves the user task
  - 'Stage I: an attacker model trained by RL with a dictionary-learning diversity reward writes injections against the undefended target'
  - 'Stage II: format SFT, then multi-objective RL (GDPO) on the successful Stage I attacks with security, utility and reasoning rewards'
  - training on AgentDyn suites only, disjoint from the AgentDojo test suites
  layout: AgentDojo agent loop; tool outputs carry the injection
  layout_compat: &id001

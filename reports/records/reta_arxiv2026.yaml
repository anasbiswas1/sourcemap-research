report:
  id: reta_arxiv2026
  slug: '2606.15441'
  title: Defending against Adaptive Prompt Injection Attacks via Reasoning-enabled Task Alignment
  first_author: Lipeng He
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2606.15441'
  version_read: arXiv v1
  first_date: '2026-06-13'
  read: F
  role: proposes
  code_release: not checked
  extraction_scope: 'Section 5: Table 2 (AgentDojo averages over six adaptive attacks and five held-out static attacks, and clean BU) for None, Spotlighting, Sandwiching, MetaSecAlign and RETA on both models; the abstract
    claim (PromptGuard, PIGuard and DataSentinel, which are detectors, and MELON, a tool filter, are left out; per-attack Tables 7 and 8, Table 3 transfer, the ablations of Tables 1 and 4 and the cost analysis not coded)'

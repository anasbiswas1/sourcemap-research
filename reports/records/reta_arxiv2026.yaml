  note: RETA's defender is trained by RL on attacks found beforehand by a trained attacker, not co-evolved online, so axis 2 is preference_optimisation (reward-based RL, as for VerIH) rather than adversarial_rl
- where: defences spot_*
  note: the paper describes Spotlighting as provenance-signalling transformations without naming the variant; coded delimiters_markers as in the other records
- where: defence msa_q
  note: the paper does not say how MetaSecAlign was obtained for Qwen3-4B (the released models are Llama-based); the base condition is matched_unstated

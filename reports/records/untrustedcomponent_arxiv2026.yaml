report:
  id: untrustedcomponent_arxiv2026
  slug: '2611.11571'
  title: 'Treating the Model as an Untrusted Component: Deterministic Policy Enforcement, Human Approval and Taint Tracking Against Prompt Injection in Tool-Using Agents, with Validation on Open-Weights Models'
  first_author: Mustafa S. Aljumaily
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2611.11571'
  version_read: arXiv v1
  first_date: '2026-11-08'
  read: F
  role: re_measures
  code_release: code, data, oracle audit and notebook provided (Section 9)
  extraction_scope: 'Sections 6.10 and 6.11: the D0, D1 and D2 rows of Tables 15 and 16 (real Qwen2.5 models) and Table 13; the abstract claim on guardrails (the deterministic monitors D4 to D8, human approval and taint tracking,
    which are system-level, the detector stack D3, the simulation results of Sections 6.1 to 6.9 and Table 14, and the composed persistence results of Tables 17 and 18 not coded)'

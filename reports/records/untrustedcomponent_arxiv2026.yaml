schema_gaps:
- where: report
  note: the paper's main subject (deterministic monitors, human approval, taint tracking) is system-level and the D3 stack contains an LLM detector; both are left out under the review's scope rules, and most of the paper's
    results come from a simulation with an assumed model
- where: evaluations ev_15_*_lvl*
  note: Table 13 counts were reconstructed from printed rates; the raw sample log was not kept (p. 13); at levels 4 and 5 only half the outputs parse as tool calls
- where: evaluations ev_*_att
  note: attack episodes pool the static attack families; the paper's persistence figures (Tables 17 and 18) compose per-task rates over k attempts rather than running repeated attacks

report:
  id: struq_arxiv2024
  slug: '2402.06363'
  title: 'StruQ: Defending Against Prompt Injection with Structured Queries'
  first_author: Sizhe Chen
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2402.06363'
  version_read: arXiv v2
  first_date: '2024-02-09'
  read: F
  role: proposes
  code_release: linked from the abstract
  extraction_scope: 'Sections 5 and 5.1 to 5.4: Llama and Mistral columns of Tables 2 and 3 for the Naive, Completion-Real, Completion-Close (Max), Tree-of-Attack and GCG rows; the abstract claims (other attack rows, HackAPrompt,
    Tables 4 to 9 and Section 5.5 not coded)'
defences:
- id: struq_llama7b
  name: StruQ
  origin: this_report
  base_checkpoint: Llama-7B (base model)
  axis1:
  - delimiters_markers
  axis2:
  - sft
  isolation: ablation_present
  signal_dependence: stated
  trains_instruction_pair: 'no'
  trains_carry_through: 'no'
  page: 9
  components:
  - 'secure front-end: reserved special tokens as delimiters, the delimiter strings filtered out of the data'
  - structured instruction tuning on cleaned Alpaca with Naive and Completion-Other injections in the data part
  layout: instruction, data and response sections each opened by reserved delimiter tokens in one prompt
  layout_compat:
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: untested
  released_weights: code linked; weights not checked
  anchor: We apply StruQ to two popular open-source foundation models
  signal_dependence_detail: Section 5.4 trains separate models with textual or special delimiters (Table 6, attack success 1% in every combination); no run of a trained StruQ model with its delimiters removed or moved
  pages:
    isolation: 11
    signal_dependence: 12
    layout: 7

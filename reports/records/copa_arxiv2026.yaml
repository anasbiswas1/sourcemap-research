  slug: '2608.19982'
  title: 'COPA: Continual Preference Optimization for Adaptive Prompt Injection Defense'
  first_author: Roshan Sood
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2608.19982'
  version_read: arXiv v1
  first_date: '2026-08-20'
  read: F
  role: proposes
  code_release: none found in the paper
  extraction_scope: 'whole report (7 pages): Figure 1 (ASR in scenarios S1 to S3 for no defence, SecAlign and COPA), the ASR stated in Section IV-B for SecAlign and COPA over the lifelong sequence, and the GPQA and MMLU accuracies
    of Figure 4 and Section IV-B; the abstract claim (LlamaGuard and DataSentinel, which are detectors, are left out; the other backbones of Figure 5, backward transfer and average performance for the baselines, and the ablations
    of Tables I and II not coded)'

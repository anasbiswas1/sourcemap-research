report:
  id: guardrag_uwthesis2026
  slug: title_guardragadversarialpreferencetrainingagainstindirectpromptin
  title: 'GuardRAG: Adversarial Preference Training Against Indirect Prompt Injection Attacks'
  first_author: Gayatri Malladi
  venue: Master's thesis, University of Washington (ResearchWorks)
  peer_reviewed: 'no'
  version_read: thesis PDF from ResearchWorks
  first_date: '2026-01-01'
  read: F
  role: mixed
  code_release: not checked
  extraction_scope: 'Chapters 5, 7.3 and 9.1, Appendix 12.3: Table 9.1 (stealth split attack success, clean split utility retention), Table 9.2 (attack success on five external benchmarks) and Table 9.3 (native InjecAgent
    format) for Base, Baseline-SimPO, SAGE-C, DPO and ORPO on Meta-Llama-3-8B-Instruct; Table 12.21 (8B against 70B SAGE-C); the abstract claims and the format-coupling finding (RIPE-II, the undefended-model benchmark of Chapters
    4 and 8, is not coded as a defence; PRISM-Mem is a memory firewall and best-of-N reranking uses a separate reward model, both left out as system level; detection, report quality and the adaptive-hardening runs are not
    coded)'
defences:
- id: sagec
  name: GuardRAG with the SAGE-C security-adaptive SimPO objective (LoRA)
  origin: this_report
  base_checkpoint: Meta-Llama-3-8B-Instruct
  axis1:
  - delimiters_markers
  axis2:
  - sft
  - preference_optimisation
  - distillation
  isolation: ablation_present
  signal_dependence: measured
  trains_instruction_pair: 'no'
  trains_carry_through: yes_by_preference
  page: 36
  components:
  - staged security prompt with a trust hierarchy and per-passage provenance boundaries
  - span-grounded JSON security report per passage (attack flag, family, exact evidence span, violated policy, handling)
  - security- and utility-aware preference pairs built from RIPE-II episodes, candidates generated by Llama-3.3-70B-Instruct
  - 'SAGE-C: SimPO with per-example adaptive margin, smoothing and weight from pair confidence, severity, report quality and over-defence signals'
  layout: staged security prompt (system trust hierarchy, then the user's question, then the top-5 retrieved passages, each inside an explicit provenance boundary with passage and document identifiers); output is an answer
    plus one JSON security report
  layout_compat: &id001
    user_turn: supported
    separate_role: untested
    system_context: untested
    agent_tool_result: unsupported
  signal_dependence_detail: 'Table 9.3: in the native InjecAgent ReAct format, without the report contract, SAGE-C''s attack success (53.3%) is above the base model''s (30.3%)'
  pages:
    components: 40
    signal_dependence: 85
  anchor: Its adaptive layer, SAGE-C, uses pair confidence, attack severity, report quality

report:
  id: pictionary_arxiv2026
  slug: '2609.36121'
  title: 'Render Before Reading: Visual Rendering as a Prompt Injection Defense'
  first_author: Jie Zhang
  venue: arXiv preprint
  peer_reviewed: 'no'
  arxiv: '2609.36121'
  version_read: arXiv v1
  first_date: '2026-09-28'
  read: F
  role: proposes
  code_release: https://github.com/zj-jayzhang/Pictionary (linked from the abstract)
  extraction_scope: 'Sections 4 to 6: Table 1 (ten models, DirectInject and AgentDojo), Table 2 (union of adaptive attacks), Table 4 (SWE-bench and tau2-Bench), Table 5 (audio rendering) and the No defense and Ours rows of
    Table 3; the abstract claim (PromptLocate and DataFilter, which rewrite the data, and DataSentinel, a detector, are left out; Table 6 and the appendices not coded)'

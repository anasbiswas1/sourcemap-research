id: secfid_2606.30783
title: 'Security-Fidelity Tradeoffs: The Hidden Cost of Prompt Injection Defense'
kind: benchmark
scope: 'Benchmark and evaluation paper, not a survey: 1,168 instances (plus a 252-scenario agentic extension), four
  defences in eight variants over 15 base-model settings, 48 configurations (Sections 1, 4); ICML 2026, PMLR 306.'
corpus_cutoff: not applicable
organising_dimensions: 'Related work groups defences by intervention point: input-centric filtering, prompting-level
  delimiters, model-centric fine-tuning or architecture (Section 6). The paper''s own structure is the outcome coding:
  executed, processed, ignored, other (Section 3.4).'
treatment_user_task: Not measured as a separate quantity; the task in each instance is the document task itself.
treatment_document_handling: 'Measured and defined: security is one minus the executed rate; fidelity is one minus
  the ignored rate; safe processing is processed and not executed (Section 3.5). On Llama 3.1 8B (Table 1): executed
  and ignored rates of 49.1/7.7 undefended, 5.7/24.7 ASIDE, 14.0/20.3 ISE, 0.7/26.1 SecAlign, 1.9/53.7 DefensiveTokens.
  Section 4.2 text gives 1.2 and 3.0 for the last two where Table 1 gives 0.7 and 1.9; cite Table 1 and Table 22
  (confidence intervals), not the prose.'
treatment_comparability: Each defence is run with the inference procedure its authors specify (Appendix B.1); ASIDE
  and ISE from the official ASIDE repository. No comparability rule; layouts therefore differ across the compared
  defences.
evidence_granularity: 'Per defence and base model: executed, ignored, processed rates with confidence intervals.'
what_this_review_adds: SecFid is the source of the document-handling definitions and of published security-fidelity
  pairs; this review places those pairs on the two-axis map with their layouts recorded, adds the user's task, and
  grades every comparison for layout equality, which SecFid's own protocol does not hold.

id: correia_2601.22240
title: 'A Systematic Literature Review on LLM Defenses Against Prompt Injection and Jailbreaking: Expanding NIST
  Taxonomy'
kind: survey
scope: Systematic literature review of LLM defences against prompt injection and jailbreaking, extending the NIST
  taxonomy; 88 primary studies from Scopus; states it was submitted to Computer Science Review (p. 1, p. 6).
corpus_cutoff: August 2025 (p. 6)
organising_dimensions: Training-time interventions (post-training, pre-training); deployment-time interventions
  (prompt instruction and formatting, input modification, aggregation, prompt-stealing prevention, model-level mitigations,
  detection and termination, monitoring, usage restrictions); indirect mitigations; mitigations against indirect
  prompt injection; evaluation-time interventions (Figure 1, p. 2; Sections 5.1-5.5). Delimiters sit under prompt
  instruction and formatting (p. 9); instruction hierarchy in embeddings and spotlighting under indirect-injection
  mitigations (p. 14).
treatment_user_task: Not extracted. The catalogue columns are method, description, model-agnostic, attack mitigation
  (mostly ASR, occasionally a false-positive value), attack, source code (Tables A.5-A.11). States that many works
  do not report trade-offs such as overall performance degradation (p. 15).
treatment_document_handling: Not treated beyond row descriptions.
treatment_comparability: RQ3 asks whether results are comparable (p. 2). The answer names dataset splits, model
  variants and parameters such as temperature as what prevents comparison (pp. 15-16). Layout or template is not
  named.
evidence_granularity: Per study catalogue rows (Tables A.5-A.11) with ASR where reported; no cross-study numbers.
what_this_review_adds: The signal axis separated from the training axis (this paper's top split is training-time
  versus deployment-time, a coarse form of the second axis only); the three requirements per defence; layout added
  to the comparability factors; graded comparisons.

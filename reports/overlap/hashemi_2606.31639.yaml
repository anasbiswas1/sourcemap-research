id: hashemi_2606.31639
title: 'A Lifecycle and Application-Stack Survey of Large Language Model Vulnerabilities: Attacks, Risks, Defenses,
  and Open Problems'
kind: survey
scope: Lifecycle and application-stack survey of LLM vulnerabilities; systematisation from seed papers and citation
  chasing, cross-checked against OWASP, MITRE ATLAS and NIST; no paper count or search dates (Section 2.2, p. 2).
corpus_cutoff: not stated; arXiv v1 30 June 2026
organising_dimensions: 'Attacks by lifecycle stage and application stack (Section 3). Defences in a defence-in-depth
  architecture: deterministic controls; model-level and prompt-level controls; retrieval and memory controls; tool
  and agent controls; monitoring, red teaming and governance (Section 6, pp. 9-10). Delimiters, role labels and
  instruction hierarchy are listed as examples of prompt-level controls, not as an axis.'
treatment_user_task: Named as metrics to report (clean-task accuracy, user-task utility; Section 7, p. 10); no numbers
  for any defence.
treatment_document_handling: 'Named as a design goal: a model should read untrusted content for information without
  letting it change goals (Section 9, p. 13); not measured.'
treatment_comparability: 'A reporting checklist (Table 5, p. 11) includes context construction: system prompt, retrieved
  documents, memory policy, delimiters, tool schemas, with the rationale that it is critical for prompt-injection
  and RAG studies. It is a reporting item; no rule says numbers are comparable only under the same layout.'
evidence_granularity: Narrative with reference tables; no extracted per-defence evidence.
what_this_review_adds: 'Filled records rather than a checklist: the signal axis, per-defence coverage of the three
  requirements, layout as a comparison condition with graded comparisons, and the defence card. This paper''s Table
  5 is the nearest prior naming of delimiters and templates as something to report.'

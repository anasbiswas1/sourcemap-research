id: wang_2602.10453
title: 'The Landscape of Prompt Injection Threats in LLM Agents: From Taxonomy to Analysis'
kind: sok
scope: SoK of prompt injection threats in LLM agents; 78 papers (37 attack, 41 defence); search ended 20 October
  2025 (p. 1; pp. 4 and 6).
corpus_cutoff: 20 October 2025 (p. 1)
organising_dimensions: 'Defences by level: text-level (detection filters; prompt enhancement by separation, negative
  prompts, rewriting), model-level (alignment by fine-tuning; internal-representation probes), execution-level (task
  alignment, access control, isolation) (Figure 2, p. 5; Table 2, p. 6; Sections 4.1-4.3, pp. 7-9). The ''separate''
  family uses delimiters and structure, and alignment trains on specific interaction formats, but there is no axis
  over signal forms.'
treatment_user_task: 'Eight defences run on AgentPI with GPT-4o-mini: ASR and utility under no attack (Figure 6,
  p. 12), time and tokens (Table 5, p. 13). Utility under attack is not reported.'
treatment_document_handling: Not measured. The paper states that many defences appear effective by suppressing contextual
  inputs (abstract, p. 1) and by coarse-grained refusal (p. 11), which is the symptom this review's third requirement
  measures.
treatment_comparability: All defences run on one model and one benchmark, an applied condition; a change of prompt
  structure is counted as an intrusiveness cost (p. 10), not as a condition for comparing numbers.
evidence_granularity: 'Per defence on one model: ASR, no-attack utility, time, tokens (Figure 6, Table 5); the model-level
  defences are not run.'
what_this_review_adds: The signal axis with the no-signal value; the user's task under attack and the document-handling
  requirement measured, which turns this paper's suppression remark into a number; layout as a comparison condition;
  graded comparisons across published numbers including model-side defences.

id: hong_2510.15476
title: 'SoK: Systematizing LLM Prompt Security: Taxonomies, Datasets, and Unified Evaluation of Attacks and Defenses'
kind: sok
scope: 'SoK of LLM prompt security centred on jailbreaks: 272 papers, collection last updated May 2026; three taxonomies
  and a unified evaluation platform (Sections 1, 2.1, 3). States that it focuses on textual jailbreak attacks and
  defences (Section 1); the platform supports single-turn interactions only (Section 3.2).'
corpus_cutoff: May 2026 (Section 2.1)
organising_dimensions: Defence taxonomy by goal (detection, mitigation), then intervention point (input, output,
  inner state; input processing, model training, model-side intervention, output processing), then operation (Section
  2.5, Figure 2). Provenance marking and delimiting are techniques under prompt modification; safety prompts with
  optimised embeddings sit beside them. No axis over signal forms.
treatment_user_task: 'Per defence under one protocol: ASR, defence gain, sample-wise transitions (Table 2, Section
  4.1); benign utility on MMLU, TruthfulQA, FollowBench, IFEval and refusal rate, with over-refusal relative to
  no defence (Section 4.4). This is general capability without attack, not the user''s task under attack.'
treatment_document_handling: Not measured; the evaluated attacks are direct harmful queries, not instructions carried
  in documents or tool outputs.
treatment_comparability: States that two results are directly comparable only when component identities and relevant
  settings match, over the tuple model, attack, defence, dataset, judge plus decoding, assistant models, budgets,
  thresholds, judge rubrics and parsing rules (Section 3.1). The strongest comparability rule among the surveys;
  the prompt layout is not a listed element.
evidence_granularity: 11 models, 20 attacks, 9 defences, 3 judges run under one protocol with audit logs.
what_this_review_adds: Indirect injection as the subject; the signal axis; the user's task under attack and document
  handling; the layout condition added to a comparability rule that this paper already states for model, attack,
  dataset, judge and decoding; grades for published comparisons instead of a re-run.

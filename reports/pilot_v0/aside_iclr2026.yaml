schema_gaps:
- where: defences aside_*
  note: the signal is a fixed, non-learned rotation of the data tokens' embeddings; axis 1 has learned token features but no value for a fixed embedding transform
- where: defences aside_*
  note: signal dependence was measured only on Qwen3-8B (rotation-angle ablation, Figure 7, p. 17, values in a figure); v0 cannot record a test made on another checkpoint of the same method
- where: evaluations
  note: the undefended reference is an instruction-tuned twin trained on the same data with the standard template (Vanilla), not an off-the-shelf model; v0 has only the none:<base> convention and no field for how the reference
    was built
- where: results r10, r11, r18, r19
  note: the SEP separation score mixes executing the probe as an instruction and not executing it as data; it maps to no single quantity, coded other
- where: results
  note: values are means over three independent runs with a standard deviation or standard error; v0 has no field for the spread or the number of runs
- where: comparisons c_l_sep, c_m_sep
  note: the decoding settings for SEP and AlpacaEval are not given on the pages read (greedy is stated for the injection benchmarks, p. 20), so c6 is unreported and the grade is U
- where: claim k1
  note: the no-loss claim rests on AlpacaEval (general utility); SEP Utility, the closer measure of doing the user's task, falls for Mistral 7B (45.0 to 25.3) and Llama 3.1 8B (70.3 to 63.0), which the paper attributes to
    brittle evaluation (p. 5); v0 has no field to mark a claim as contradicted by a result in the same report

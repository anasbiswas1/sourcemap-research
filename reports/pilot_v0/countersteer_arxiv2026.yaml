schema_gaps:
- where: results r3, r6, r9, r13, r15
  note: benign utility is a percentage of the same row's own clean run, while the no-defence row is absolute; v0's unit list has no relative-to-own-baseline unit
- where: evaluations ev_g_*_ad and ev_g_*_batt
  note: the same configuration has a canonical run (.475 to .079) and a comparison-battery run (.483 to .091); v0 has no field for the run or regeneration an evaluation belongs to
- where: results r1 to r17
  note: the agentic compromise rates are stated to be lower bounds because of the per-turn generation budget (p. 6); v0 cannot mark a value as a bound
- where: defences cs_*
  note: the amendment-1 fields assume training; a fitted steering direction has a fitting set of paired episodes but no training targets, so the fields are coded no without a matching value
- where: report
  note: surviving compromises are split into delegated-authority tasks (the user's own prompt hands authority to retrieved content) and the rest (p. 7); v0 has no field for a task partition that changes how a compromise should
    be read
- where: coverage
  note: utility under attack is reported in the full-suite tables (cited, not coded here); v0 coverage cannot point to where in the report a quantity is found

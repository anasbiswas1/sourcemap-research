schema_gaps:
- where: comparisons c_*
  note: decoding settings are not reported anywhere in the paper; both arms ran in one harness, so c6 is coded matched; v0 cannot separate matched and stated from matched by construction with the value unreported
- where: comparison c_l_struq_opt
  note: the varied element is the training method (DPO against SFT), not one of the six conditions; v0 has no field naming what a mechanism comparison varies
- where: defences secalign_*
  note: facts come from several pages (models p7, format dependence p8, ablation p11); v0 allows one page per record
- where: results r_l_*_sep_util
  note: SEP utility is reported relative to the undefended model (50.0 by construction) and it is not stated whether it is scored on clean or attacked inputs; v0 has no relative-to-baseline unit and no clean/attacked flag,
    so it is coded other and R2clean coverage unclear
- where: results r_l_*_sep_*
  note: SEP ASR is reported for three injection positions (start, middle, end); v0 has no field for the position of the injection inside the data
- where: claim k2
  note: 'the utility claim rests on AlpacaEval2 and other general benchmarks only (coding rule: general utility, never R2); v0 records this through jobs but has no explicit flag'

- id: k1
  text: first method that brings the success of various prompt injections below 10%, including attacks unseen in training
  location: abstract
  anchor: reduces the success rates of various prompt injections to <10%
  jobs:
  - R1
  supported_by:
  - c_m_free
  - c_m_opt
  - c_l_opt
  page: 1
- id: k2
  text: SecAlign models keep similar utility to the model before defensive training
  location: abstract
  anchor: similar utility to the one before defensive training
  jobs:
  - general_utility
  supported_by:
  - c_m_util
  - c_l_util
  page: 1

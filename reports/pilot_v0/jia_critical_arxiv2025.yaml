schema_gaps:
- where: report
  note: only Section 5.1 (StruQ and SecAlign on Llama-3-8B-Instruct) was coded in the pilot; Instruction Hierarchy, the detectors and the Appendix base-model runs were not; v0 has no field for the extraction scope within a
    report
- where: evaluation ev_sec_alpaca_rel
  note: the win rate uses the undefended model as the reference instead of davinci003, so the number is relative to the baseline by construction; v0 has no reference-model field for a relative judge
- where: evaluations ev_*_gcg
  note: the optimisation-based runs use a 50-tuple subset of the 4,900; v0's split field is free text and cannot link a subset to its parent set
- where: comparisons
  note: the report's central point is a disagreement with SecAlign's own results (utility and GCG success); v0 has no cross-report link from an evaluation here to the original report's evaluation of the same checkpoint (secalign_ccs2025)

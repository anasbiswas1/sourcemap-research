hong_2510.15476:
  scope: SoK of LLM prompt security, jailbreak-centred; 272 studies; three taxonomies; unified evaluation.
  corpus_cutoff: 2025 (v4 October 2026; to confirm)
  organising_dimensions: Taxonomies of attacks, defences (by goal and methodology; a defence decision layer of input,
    output, internal state or prompt policy) and vulnerabilities; an evaluation protocol over model, access setting,
    attack, defence, sample and judge.
  treatment_user_task: Not as its own quantity (to confirm).
  treatment_document_handling: Not treated (jailbreak setting).
  treatment_comparability: Configuration-aware reporting over the tuple; prompt layout is not in the tuple.
  evidence_granularity: 11 models, 20 attacks, 9 defences, 3 judges under one protocol.
  what_this_review_adds: Indirect injection as the subject; the signal axis; R2 and R3; layout as a condition.
  a_source_axis: partial
  b_three_jobs_together: 'no'
  c_equal_layout_rule: partial
  read_basis: arXiv abstract page and v3 HTML snippets (19 Nov 2026)
secfid_2606.30783:
  scope: 'Benchmark, not a survey: security and fidelity measured together for four defences on three bases; 1,168
    instances.'
  corpus_cutoff: not applicable
  organising_dimensions: Outcomes executed, processed, ignored, other; fidelity as one minus the ignored rate (non-suppression);
    safe processing as processed and not executed.
  treatment_user_task: Not measured separately.
  treatment_document_handling: 'Measured: non-suppression and safe processing on translation, editing, extraction
    and counting.'
  treatment_comparability: Each defence run with its own specified inference procedure (Appendix B.1).
  evidence_granularity: 'Per defence and base model: security and fidelity percentages.'
  what_this_review_adds: SecFid is the source of the R3 definitions and of published pairs; the review places its
    numbers on the map with their layouts.
  a_source_axis: 'no'
  b_three_jobs_together: partial
  c_equal_layout_rule: 'no'
  read_basis: full PDF (research pass, 19 Nov 2026)

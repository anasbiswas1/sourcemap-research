wang_2602.10453:
  scope: Prompt-injection threats and defences in LLM agents; 78 papers; defences by the stage at which they act.
  corpus_cutoff: early 2026 (to confirm from the PDF)
  organising_dimensions: 'Attacks by payload generation. Defences by stage: text level (detection filters, prompt
    enhancement), model level (model alignment by task, preference or format; internal-representation detectors),
    execution level (task alignment, access control, isolation).'
  treatment_user_task: Utility without attack as a general score on AgentPI; not the user's instruction under attack
    as its own quantity.
  treatment_document_handling: Not measured. The paper finds that defences look good by suppressing contextual inputs,
    which is the symptom.
  treatment_comparability: Prompt-structure changes counted as a compatibility cost; layout not treated as a condition
    for comparing numbers.
  evidence_granularity: Benchmark results (ASR, utility, time, tokens) for eight text- and execution-level defences;
    no model-level defence run.
  what_this_review_adds: Finer first axis with no-signal as a value; signal dependence; R2 and R3 coverage; evidence
    grades for comparisons.
  a_source_axis: partial
  b_three_jobs_together: 'no'
  c_equal_layout_rule: 'no'
  read_basis: full PDF (research pass, 19 Nov 2026)
ji_2511.15203:
  scope: Defence frameworks for indirect prompt injection in LLM agents.
  corpus_cutoff: late 2025 (to confirm)
  organising_dimensions: 'Five dimensions: technical paradigm, intervention stage, model access, explainability,
    automation level.'
  treatment_user_task: Utility on AgentDojo (task success) for nine frameworks; not the user's instruction as its
    own quantity.
  treatment_document_handling: Not measured.
  treatment_comparability: Prompt templates and delimiters appear as implementation details; no comparability condition.
  evidence_granularity: ASR and utility for nine frameworks under three adaptive attacks; Meta-SecAlign the only
    training defence.
  what_this_review_adds: Model-side defences as the subject; the two axes; R2 and R3; grades.
  a_source_axis: partial
  b_three_jobs_together: 'no'
  c_equal_layout_rule: 'no'
  read_basis: full PDF (research pass, 19 Nov 2026)
correia_2601.22240:
  scope: Systematic literature review of LLM defences against prompt injection and jailbreaking; 88 studies to August
    2025.
  corpus_cutoff: August 2025
  organising_dimensions: 'NIST-based tree: training-time interventions; deployment-time interventions (prompt instruction
    and formatting, input modification, aggregation, model-level mitigations such as decoding steering and defensive
    pruning, detection, monitoring); indirect mitigations.'
  treatment_user_task: ASR is the main metric; some studies also report performance; trade-offs often not reported
    (p. 15).
  treatment_document_handling: Not treated.
  treatment_comparability: RQ3 asks whether results are comparable; Section 6.2 names dataset splits, model variants
    and temperature; prompt layout is not among the factors.
  evidence_granularity: Catalogue with model, attack dataset, code and model-agnosticism per study (Table 3).
  what_this_review_adds: The inference-time signal axis separated from the training axis; R2 and R3; layout as a
    condition; grades.
  a_source_axis: partial
  b_three_jobs_together: 'no'
  c_equal_layout_rule: 'no'
  read_basis: full PDF (research pass, 19 Nov 2026)
hashemi_2606.31639:
  scope: Lifecycle and application-stack survey of LLM vulnerabilities; systematisation rather than exhaustive bibliometrics.
  corpus_cutoff: mid 2026 (to confirm)
  organising_dimensions: 'Defence-in-depth: deterministic controls; model-level and prompt-level controls; retrieval
    and memory controls; tool and agent controls; monitoring, red teaming, governance.'
  treatment_user_task: No numbers reported.
  treatment_document_handling: Not treated.
  treatment_comparability: A reporting checklist (Table 5) lists context construction including delimiters and templates
    as items to report; not a comparability condition.
  evidence_granularity: Narrative; no extracted evidence tables.
  what_this_review_adds: Measured coverage of the three jobs; graded comparisons; the card as a filled artefact.
